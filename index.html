  <tr><td>Anterior</td><td>Ligamento hepatoduodenal (tríade portal)</td></tr>
  <tr><td>Posterior</td><td>Peritônio parietal sobre VCI + pilar direito do diafragma</td></tr>
  <tr><td>Superior</td><td>Face visceral do fígado (lobo caudado)</td></tr>
  <tr><td>Inferior</td><td>Primeira porção do duodeno</td></tr>
</table>`},

{cat:3,src:"UNICH 25.1",b:"b-unc",q:"Cálice menor do rim — ponto de transição do ureter abdominal para pélvico",a:`
<h4>Cálice Menor do Rim</h4>
Estrutura que cobre diretamente as papilas renais (onde se abrem os ductos coletores). 8-18 cálices menores → agrupam-se em 2-3 <strong>cálices maiores</strong> → pelve renal → ureter.
<h4>Ponto de Transição Ureter Abdominal → Pélvico</h4>
O ureter cruza a <strong>bifurcação dos vasos ilíacos comuns</strong> (ao nível de L5-S1 / articulação sacroilíaca) para entrar na pelve. Este ponto é um dos <strong>3 estreitamentos fisiológicos</strong> do ureter (onde cálculos tendem a impactar):
<ol style="padding-left:18px">
  <li>Junção ureteropélvica (JUP)</li>
  <li><strong>Cruzamento com os vasos ilíacos</strong> (transição abdominal-pélvica)</li>
  <li>Entrada na bexiga (junção ureterovesical — JUV — mais estreita)</li>
</ol>`},

{cat:3,src:"UNICH 25.1",b:"b-unc",q:"Artéria suprarrenal inferior direita — grupos das artérias suprarrenais",a:`
<h4>Artéria Suprarrenal Inferior Direita</h4>
Ramo da <strong>artéria renal direita</strong>. Irriga o polo inferior da glândula suprarrenal (adrenal) direita.
<h4>3 Grupos das Artérias Suprarrenais</h4>
<table>
  <tr><th>Grupo</th><th>Origem</th><th>Nível</th></tr>
  <tr><td>Superior</td><td>A. frênica inferior</td><td>Diafragma</td></tr>
  <tr><td>Média</td><td>Aorta abdominal direta</td><td>L1</td></tr>
  <tr><td>Inferior</td><td>A. renal (ipsilateral)</td><td>L1-L2</td></tr>
</table>
<div class="alert">A drenagem venosa é assimétrica: V. suprarrenal direita drena direto para VCI; V. suprarrenal esquerda drena para V. renal esquerda.</div>`},

// ── PELVE E PERÍNEO ───────────────────────────────────────────
{cat:4,src:"UNICH 26.1",b:"b-unc",q:"Comissura anterior do pudendo — irrigação do ovário",a:`
<h4>Comissura Anterior do Pudendo</h4>
Ponto de encontro dos grandes lábios anteriormente ao clitóris. Marco do períneo feminino anterior.
<h4>Irrigação do Ovário</h4>
<table>
  <tr><th>Artéria</th><th>Origem</th><th>Território</th></tr>
  <tr><td><strong>A. ovariana</strong></td><td>Aorta abdominal (L1-L2)</td><td>Ovário (maior parte), tuba uterina (lateral), ureter</td></tr>
  <tr><td><strong>Ramo ovariano da A. uterina</strong></td><td>A. ilíaca interna (via a. uterina)</td><td>Ovário (porção medial) — anastomosa-se com a ovariana</td></tr>
</table>
<div class="alert">Anastomose ovariana-uterina → importante para circulação colateral. A veia ovariana direita drena na VCI; a esquerda drena na veia renal esquerda.</div>`},

{cat:4,src:"UNICH 26.1",b:"b-unc",q:"Todos os órgãos genitais internos e suas funções",a:`
<h4>Femininos</h4>
<table>
  <tr><th>Órgão</th><th>Função</th></tr>
  <tr><td>Ovários</td><td>Ovogênese, secreção de estrogênio e progesterona</td></tr>
  <tr><td>Tubas uterinas</td><td>Captação do óvulo, local da fecundação, transporte do embrião</td></tr>
  <tr><td>Útero</td><td>Implantação, gestação, parto</td></tr>
  <tr><td>Vagina</td><td>Canal do parto, receptáculo do pênis, eliminação do fluxo menstrual</td></tr>
</table>
<h4>Masculinos</h4>
<table>
  <tr><th>Órgão</th><th>Função</th></tr>
  <tr><td>Testículos</td><td>Espermatogênese, secreção de testosterona</td></tr>
  <tr><td>Epidídimo</td><td>Maturação e armazenamento dos espermatozoides</td></tr>
  <tr><td>Ducto deferente</td><td>Transporte dos espermatozoides</td></tr>
  <tr><td>Vesículas seminais</td><td>Secretam frutose, prostaglandinas e proteínas coaguladoras (60-70% do sêmen)</td></tr>
  <tr><td>Próstata</td><td>Secreção alcalina que nutre e protege espermatozoides (20-30%)</td></tr>
  <tr><td>Glândulas bulbouretrais (Cowper)</td><td>Muco lubrificante pré-ejaculação</td></tr>
</table>`},

{cat:4,src:"UFC 24.2",b:"b-ufc",q:"8 ramos da artéria ilíaca interna",a:`
<h4>Divisão Anterior</h4>
<ul>
  <li>A. umbilical → A. vesical superior (bexiga) + A. do ducto deferente</li>
  <li>A. vesical inferior (bexiga, próstata, vesícula seminal)</li>
  <li>A. uterina (útero, tuba, ovário) / A. vaginal</li>
  <li>A. retal média</li>
  <li>A. pudenda interna (períneo, genitais externos, reto inferior)</li>
  <li>A. obturatória (compartimento medial da coxa)</li>
</ul>
<h4>Divisão Posterior</h4>
<ul>
  <li>A. iliolumbar</li>
  <li>Aa. sacrais laterais</li>
  <li>A. glútea superior (maior ramo — compartimento glúteo)</li>
  <li>A. glútea inferior</li>
</ul>`},

{cat:4,src:"UFC 2015",b:"b-ufc",q:"Partes da tuba uterina",a:`
<h4>4 Partes da Tuba Uterina (medial → lateral)</h4>
<table>
  <tr><th>Parte</th><th>Local</th><th>Característica</th></tr>
  <tr><td><strong>Parte uterina (intramural)</strong></td><td>Dentro da parede uterina</td><td>Menor, mais estreita</td></tr>
  <tr><td><strong>Istmo</strong></td><td>Próximo ao útero</td><td>Mais estreito, paredes espessas — local de ligadura tubária</td></tr>
  <tr><td><strong>Ampola</strong></td><td>Porção média</td><td>Mais longa e larga — <em>local da fecundação</em></td></tr>
  <tr><td><strong>Infundíbulo</strong></td><td>Extremidade distal</td><td>Em forma de funil, com fímbrias — a fímbria ovárica é a maior</td></tr>
</table>`},

{cat:4,src:"UFC 2015",b:"b-ufc",q:"Plexo lombar — formação e ramos",a:`
<h4>Formação</h4>
Raízes: <strong>T12 (parcial), L1, L2, L3, L4</strong> (parcial) — dentro do músculo psoas maior.
<h4>Ramos</h4>
<table>
  <tr><th>Nervo</th><th>Raízes</th><th>Território motor/sensitivo</th></tr>
  <tr><td>N. iliohipogástrico</td><td>L1 (T12)</td><td>Oblíquos inf. / pele inguinal e hipogástrica</td></tr>
  <tr><td>N. ilioinguinal</td><td>L1</td><td>Oblíquos / pele escroto/lábio maior, raiz do pênis/clitóris</td></tr>
  <tr><td>N. genitofemoral</td><td>L1, L2</td><td>M. cremaster / escroto + face anterior coxa</td></tr>
  <tr><td>N. cutâneo lateral da coxa</td><td>L2, L3</td><td>Apenas sensitivo — face lateral da coxa</td></tr>
  <tr><td><strong>N. femoral</strong></td><td>L2, L3, L4</td><td>Quadríceps, sartório, ilíaco / face anterior coxa + perna medial (n. safeno)</td></tr>
  <tr><td><strong>N. obturatório</strong></td><td>L2, L3, L4</td><td>Adutores da coxa / face medial da coxa</td></tr>
  <tr><td>Tronco lombossacral</td><td>L4, L5</td><td>Contribui para o plexo sacral</td></tr>
</table>`},

{cat:4,src:"UNICH 23.1",b:"b-unc",q:"Fórnice vaginal — localização e limites",a:`
<h4>Fórnice Vaginal</h4>
Recessos anulares formados pela vagina ao redor do colo do útero (cérvix).
<h4>Divisões</h4>
<table>
  <tr><th>Porção</th><th>Relações Anatômicas</th></tr>
  <tr><td><strong>Posterior</strong> (mais profunda)</td><td>Relaciona-se com a escavação rectouterina (fundo de saco de Douglas) — importante acesso cirúrgico e culdocentese</td></tr>
  <tr><td><strong>Anterior</strong></td><td>Relaciona-se com a base da bexiga e uretra</td></tr>
  <tr><td><strong>Laterais</strong> (dir. e esq.)</td><td>Relacionam-se com os ureteres e vasos uterinos</td></tr>
</table>`},

{cat:4,src:"UNICH 23.1",b:"b-unc",q:"Glândula seminal — o que desemboca nela",a:`
<h4>Vesícula Seminal (Glândula Seminal)</h4>
Glândula par, localizada posterior à bexiga e superior à próstata.
<h4>O Que Desemboca</h4>
<ul>
  <li>O ducto da vesícula seminal + o ducto deferente (ampola) se unem para formar o <strong>ducto ejaculatório</strong></li>
  <li>Os ductos ejaculatórios (direito e esquerdo) atravessam a próstata e desembocam na <strong>uretra prostática</strong> no colículo seminal (verumontanum)</li>
</ul>
<h4>Função</h4>
Secreta ~60-70% do volume do sêmen: frutose (nutrição), prostaglandinas, proteínas de coagulação.`},

{cat:4,src:"UNICH 23.2",b:"b-unc",q:"Reto — anatomia e relações",a:`
<h4>Reto</h4>
Porção terminal do intestino grosso. Começa ao nível de S3 (junção retossigmoidiana) e termina no canal anal.
<h4>Flexuras</h4>
<ul>
  <li>Flexura sacral (segue a curvatura do sacro)</li>
  <li>Flexura perineal (curva posterior ao cruzar o diafragma pélvico)</li>
  <li>Flexuras laterais (3)</li>
</ul>
<h4>Relações</h4>
<table>
  <tr><th>Parede</th><th>Relações</th></tr>
  <tr><td>Anterior (masc.)</td><td>Bexiga, próstata, vesículas seminais, ductos deferentes, uretra</td></tr>
  <tr><td>Anterior (fem.)</td><td>Útero e vagina (escavação rectouterina)</td></tr>
  <tr><td>Posterior</td><td>Sacro, cóccix, vasos sacrais, n. sacral</td></tr>
</table>`},

{cat:4,src:"UNICH 24.1",b:"b-unc",q:"Óstio do cérvix uterino — músculos do assoalho pélvico e inervação",a:`
<h4>Óstio do Cérvix</h4>
Abertura do canal cervical no útero (óstio interno) e na vagina (óstio externo). Em nulíparas: circular; em multíparas: transversal.
<h4>Músculos do Assoalho Pélvico (Diafragma Pélvico)</h4>
<table>
  <tr><th>Músculo</th><th>Inervação</th></tr>
  <tr><td><strong>Levantador do ânus</strong> (puborretal, pubococcígeo, iliococcígeo)</td><td>N. levantador do ânus (S3-S4) + ramo perineal do pudendo</td></tr>
  <tr><td><strong>Coccígeo (isquiococcígeo)</strong></td><td>N. coccígeo (S4-S5)</td></tr>
</table>
<h4>Membranas do Períneo (abaixo do diafragma pélvico)</h4>
<ul>
  <li>M. transverso profundo do períneo + m. esfíncter externo da uretra → diafragma urogenital</li>
  <li>Inervação: ramo perineal do N. pudendo (S2-S4)</li>
</ul>`},

{cat:4,src:"UNICH 24.1",b:"b-unc",q:"Artéria umbilical — pelo menos 8 ramos da ilíaca interna",a:`
<h4>Artéria Umbilical</h4>
Ramo da divisão anterior da ilíaca interna. No feto: transporta sangue fetal desoxigenado para a placenta. Após o nascimento: oblitéra-se distalmente → ligamento umbilical medial. Proximalmente: permanece pérvia como a <strong>artéria vesical superior</strong>.
<h4>8 Ramos da Artéria Ilíaca Interna</h4>
<strong>Divisão anterior:</strong> Umbilical (→ vesical superior) · Vesical inferior · Uterina/vaginal · Retal média · Pudenda interna · Obturatória · Glútea inferior<br>
<strong>Divisão posterior:</strong> Iliolumbar · Sacrais laterais · <strong>Glútea superior</strong>`},

{cat:4,src:"UNICH 24.1",b:"b-unc",q:"Ducto deferente — limites do canal inguinal",a:`
<h4>Ducto Deferente</h4>
Conduz espermatozoides do epidídimo à uretra prostática. Percorre o canal inguinal como componente do funículo espermático, cruza os vasos ilíacos externos, desce na pelve, dilata-se na <strong>ampola</strong>, une-se à vesícula seminal → ducto ejaculatório.
<h4>Limites do Canal Inguinal</h4>
<table>
  <tr><th>Parede</th><th>Estrutura</th></tr>
  <tr><td>Anterior</td><td>Aponeurose do oblíquo externo (toda extensão) + oblíquo interno (1/3 lateral)</td></tr>
  <tr><td>Posterior</td><td>Fáscia transversal (toda extensão) + tendão conjunto (1/3 medial)</td></tr>
  <tr><td>Superior (teto)</td><td>Fibras arqueadas do oblíquo interno + transverso</td></tr>
  <tr><td>Inferior (assoalho)</td><td>Ligamento inguinal + ligamento lacunar (medialmente)</td></tr>
  <tr><td>Abertura medial</td><td>Anel inguinal superficial (na aponeurose do oblíquo externo)</td></tr>
  <tr><td>Abertura lateral</td><td>Anel inguinal profundo (na fáscia transversal)</td></tr>
</table>`},

{cat:4,src:"UNICH 25.1",b:"b-unc",q:"Artéria sacral lateral — hérnia inguinal congênita",a:`
<h4>Artéria Sacral Lateral</h4>
Ramo da divisão posterior da ilíaca interna. Par (superior e inferior). Entra pelos forames sacrais pélvicos, irriga o sacro, raízes nervosas sacrais, m. piriforme.
<h4>Hérnia Inguinal Congênita</h4>
<ul>
  <li>Ocorre por persistência (não obliteração) do <strong>processo vaginal do peritônio</strong> (canal peritôneo-vaginal)</li>
  <li>Durante o desenvolvimento: o testículo desce retroperitonealmente arrastando o processo vaginal</li>
  <li>Normalmente: o processo vaginal se fecha após a descida testicular</li>
  <li>Se persistir: o conteúdo abdominal pode herniá-lo → hérnia inguinal indireta congênita</li>
  <li>Sempre indireta (passa pelo anel inguinal profundo e lateral à epigástrica inferior)</li>
</ul>`},

{cat:4,src:"UNICH 25.1",b:"b-unc",q:"Todos os ligamentos do útero",a:`
<h4>Ligamentos do Útero</h4>
<table>
  <tr><th>Ligamento</th><th>Trajeto</th><th>Função/Conteúdo</th></tr>
  <tr><td><strong>Largo</strong> (mesométrio)</td><td>Útero → parede lateral da pelve</td><td>Peritônio em dupla folha; contém tubas, ovários, vasos</td></tr>
  <tr><td><strong>Redondo</strong></td><td>Corno uterino → anel inguinal profundo → grande lábio</td><td>Mantém anteversão; contém fibras musculares lisas</td></tr>
  <tr><td><strong>Cardinal</strong> (Mackenrodt)</td><td>Cérvix → parede lateral pélvica</td><td>Principal suporte do útero; contém A. uterina e ureter</td></tr>
  <tr><td><strong>Uterossacral</strong></td><td>Cérvix → sacro</td><td>Suporte posterior; contém fibras nervosas autonômicas</td></tr>
  <tr><td><strong>Pubocervical</strong></td><td>Cérvix → púbis</td><td>Suporte anterior</td></tr>
</table>
<div class="alert">Macete dos ligamentos de suporte: <strong>C</strong>ardinal · <strong>U</strong>terossacral · <strong>P</strong>ubocervical = C U P (sustentam o cérvix)</div>`},

{cat:4,src:"UNICH 25.1",b:"b-unc",q:"Sulco balanoprepucial — formação da raiz do pênis",a:`
<h4>Sulco Balanoprepucial</h4>
Sulco circular que separa a glande do pênis do prepúcio. Nele localizam-se as <strong>glândulas prepuciais</strong> (de Tyson), que secretam o esmegma.
<h4>Formação da Raiz do Pênis</h4>
A raiz do pênis é a porção fixa, ancorada ao períneo, formada por 3 corpos eréteis:
<ul>
  <li><strong>Bulbo do pênis</strong>: parte proximal do corpo esponjoso, coberto pelo músculo bulboesponjoso, fixado à membrana perineal</li>
  <li><strong>Crura do pênis</strong> (par): partes proximais dos corpos cavernosos, cobertas pelos músculos isquiocavernosos, fixadas nos ramos isquiopúbicos</li>
</ul>
<h4>Inervação e Vascularização da Raiz</h4>
<ul>
  <li>A. pudenda interna → A. do bulbo + Aa. profundas do pênis + A. dorsal do pênis</li>
  <li>N. pudendo → ramo perineal + N. dorsal do pênis</li>
</ul>`},

// ── MEMBRO SUPERIOR ──────────────────────────────────────────
{cat:5,src:"UNICH 26.1",b:"b-unc",q:"Processo coronóide da ulna — músculo que se insere, origem, ação e inervação",a:`
<h4>Processo Coronóide da Ulna</h4>
Projeção anterior da ulna proximal, que encaixa na fossa coronóide do úmero na flexão.
<h4>Músculo Inserido: Braquial</h4>
<table>
  <tr><th></th><th></th></tr>
  <tr><td><strong>Origem</strong></td><td>Face anterior do úmero (metade distal)</td></tr>
  <tr><td><strong>Inserção</strong></td><td>Tuberosidade e processo coronóide da ulna</td></tr>
  <tr><td><strong>Ação</strong></td><td>Flexão do antebraço (em todas as posições — músculo puro flexor)</td></tr>
  <tr><td><strong>Inervação</strong></td><td>N. musculocutâneo (C5-C6) — porção lateral pelo radial (C7)</td></tr>
</table>
<div class="alert">Também se insere no coronóide o músculo pronador redondo (N. mediano) — porção ulnar.</div>`},

{cat:5,src:"UNICH 26.1",b:"b-unc",q:"N. Interósseo anterior — formação e ramos dos arcos palmares superficial e profundo",a:`
<h4>Nervo Interósseo Anterior</h4>
Ramo do <strong>nervo mediano</strong> que emerge ~5 cm distal ao epicôndilo medial. Motor puro. Inerva: flexor longo do polegar, metade lateral do flexor profundo dos dedos (2º e 3º dedos) e pronador quadrado. Lesão: incapacidade de pinça (sinal da bênção entre polegar e indicador).
<h4>Arco Palmar Superficial</h4>
<ul>
  <li>Formado principalmente pela <strong>A. ulnar</strong> + anastomose com a A. palmar superficial (ramo da radial)</li>
  <li>Convexidade voltada para os dedos ao nível da prega palmar distal</li>
  <li>Emite <strong>Aa. digitais palmares comuns</strong> (3) → Aa. digitais palmares próprias</li>
</ul>
<h4>Arco Palmar Profundo</h4>
<ul>
  <li>Formado principalmente pela <strong>A. radial</strong> (ramo palmar profundo) + anastomose com o ramo profundo da ulnar</li>
  <li>Mais profundo (sob os tendões flexores)</li>
  <li>Emite <strong>Aa. metacarpais palmares</strong> (3)</li>
</ul>`},

{cat:5,src:"UFC 24.2",b:"b-ufc",q:"Posição da mão na lesão do N. Radial, Ulnar e Mediano",a:`
<h4>Lesão do Nervo Radial</h4>
<strong>Mão em gota</strong> (wrist drop): impossibilidade de extensão do punho e dedos. Lesão alta (espiral do úmero): paralisia de todos os extensores + braquiorradial + supinador.
<h4>Lesão do Nervo Ulnar</h4>
<strong>Mão em garra ulnar</strong> (claw hand): hiperextensão das MCF + flexão das IF do 4º e 5º dedos (paralisia dos interósseos e lumbricais 3 e 4). Atrofia da eminência hipotenar. Sinal de Froment positivo (flexão do polegar com pinça).
<h4>Lesão do Nervo Mediano</h4>
<strong>Mão de pregador (benedição)</strong>: lesão alta → incapacidade de flexão dos dedos 1, 2, 3 e do polegar; lesão baixa (síndrome do túnel do carpo) → atrofia da eminência tenar, fraqueza de oponência e abdução do polegar. Déficit sensitivo na palma radial e 3,5 dedos laterais.`},

{cat:5,src:"UFC 24.2",b:"b-ufc",q:"Origem, inserção e ação do M. Flexor ulnar do carpo",a:`
<h4>M. Flexor Ulnar do Carpo</h4>
<table>
  <tr><th></th><th></th></tr>
  <tr><td><strong>Origem</strong></td><td>Cabeça umeral: epicôndilo medial; Cabeça ulnar: olécrano e borda posterior da ulna (2/3 sup.)</td></tr>
  <tr><td><strong>Inserção</strong></td><td>Osso pisiforme → ligamento pisiohamato → base do 5º metacarpo</td></tr>
  <tr><td><strong>Ação</strong></td><td>Flexão e <strong>desvio ulnar</strong> do punho</td></tr>
  <tr><td><strong>Inervação</strong></td><td><strong>N. Ulnar</strong> (C7-C8-T1)</td></tr>
</table>
<div class="alert">O único músculo do antebraço inervado exclusivamente pelo nervo ulnar (os demais são mediano ou radial).</div>`},

{cat:5,src:"UFC 24.2",b:"b-ufc",q:"Formação e ramos dos arcos palmar superficial e profundo",a:`
<h4>Arco Palmar Superficial</h4>
<strong>Formação:</strong> A. ulnar (dominant) + A. palmar superficial (ramo da radial)<br>
<strong>Ramos:</strong> 3 Aa. digitais palmares comuns → dividem-se em Aa. digitais palmares próprias (bordas dos dedos 2-5)
<h4>Arco Palmar Profundo</h4>
<strong>Formação:</strong> A. radial (dominant — ramo palmar profundo) + ramo palmar profundo da ulnar<br>
<strong>Ramos:</strong> 3 Aa. metacarpais palmares → anastomosam com as aa. digitais palmares comuns
<div class="alert">Macete: Superficial = Ulnar-dominante | Profundo = Radial-dominante</div>`},

{cat:5,src:"UFC 24.2",b:"b-ufc",q:"Origem, inserção e ação dos músculos do braço",a:`
<h4>Compartimento Anterior (Flexores)</h4>
<table>
  <tr><th>Músculo</th><th>Origem</th><th>Inserção</th><th>Ação</th><th>Nervo</th></tr>
  <tr><td>Bíceps braquial</td><td>Cabeça curta: processo coracoide; Cabeça longa: tubérculo supraglenoidal</td><td>Tuberosidade radial + aponeurose bicipital</td><td>Flexão do cotovelo + supinação (principal supinador)</td><td>Musculocutâneo</td></tr>
  <tr><td>Braquial</td><td>Face anterior do úmero (½ distal)</td><td>Tuberosidade + coronóide da ulna</td><td>Flexão do antebraço</td><td>Musculocutâneo (+ radial lateral)</td></tr>
  <tr><td>Coracobraquial</td><td>Processo coracoide</td><td>Face medial do úmero</td><td>Flexão + adução do braço</td><td>Musculocutâneo</td></tr>
</table>
<h4>Compartimento Posterior (Extensores)</h4>
<table>
  <tr><th>Músculo</th><th>Origem</th><th>Inserção</th><th>Ação</th><th>Nervo</th></tr>
  <tr><td>Tríceps (3 cabeças)</td><td>Longa: tubérculo infraglenoidal; Lateral e medial: face posterior do úmero</td><td>Olécrano da ulna</td><td>Extensão do cotovelo (principal)</td><td>Radial</td></tr>
</table>`},

{cat:5,src:"UFC 2015",b:"b-ufc",q:"Todos os músculos inervados pelo nervo radial",a:`
<h4>N. Radial — Músculos Inervados</h4>
<strong>No braço (antes da bifurcação):</strong>
<ul>
  <li>Tríceps braquial (todas as cabeças)</li>
  <li>Ancôneo</li>
  <li>Braquiorradial</li>
  <li>Extensor radial longo do carpo</li>
</ul>
<strong>Via N. Interósseo Posterior (ramo profundo do radial):</strong>
<ul>
  <li>Extensor radial curto do carpo</li>
  <li>Supinador</li>
  <li>Extensor dos dedos</li>
  <li>Extensor do dedo mínimo</li>
  <li>Extensor ulnar do carpo</li>
  <li>Abdutor longo do polegar</li>
  <li>Extensor curto do polegar</li>
  <li>Extensor longo do polegar</li>
  <li>Extensor do indicador</li>
</ul>
<div class="alert">Macete: O radial inerva todos os EXTENSORES + supinador + braquiorradial.</div>`},

{cat:5,src:"UFC 2015",b:"b-ufc",q:"Músculos do manguito rotador — inervação e ação",a:`
<h4>SITS — 4 Músculos do Manguito Rotador</h4>
<table>
  <tr><th>Músculo</th><th>Inserção</th><th>Ação</th><th>Nervo</th></tr>
  <tr><td><strong>S</strong>upraespinal</td><td>Faceta superior do tubérculo maior</td><td>Abdução inicial (0-15°) + estabilização</td><td>N. supraescapular (C5-C6)</td></tr>
  <tr><td><strong>I</strong>nfraespinal</td><td>Faceta média do tubérculo maior</td><td>Rotação lateral (externa)</td><td>N. supraescapular (C5-C6)</td></tr>
  <tr><td><strong>T</strong>eres minor</td><td>Faceta inferior do tubérculo maior</td><td>Rotação lateral + adução</td><td>N. axilar (C5-C6)</td></tr>
  <tr><td><strong>S</strong>ubescapular</td><td>Tubérculo menor</td><td>Rotação medial (interna) — único anterior</td><td>Nn. subescapulares (C5-C6)</td></tr>
</table>
<div class="alert">Macete: <strong>SITS</strong> — Supraespinal · Infraespinal · Teres minor · Subescapular</div>`},

{cat:5,src:"UFC 2015",b:"b-ufc",q:"Ramos diretos dos troncos do plexo braquial",a:`
<h4>Ramos Diretos dos Troncos</h4>
<table>
  <tr><th>Tronco</th><th>Ramo direto</th><th>Músculo inervado</th></tr>
  <tr><td><strong>Superior</strong> (C5-C6)</td><td>N. supraescapular</td><td>Supraespinal + Infraespinal</td></tr>
  <tr><td><strong>Superior</strong> (C5-C6)</td><td>N. para subclávio</td><td>M. subclávio</td></tr>
  <tr><td>Médio e Inferior</td><td>Sem ramos diretos significativos</td><td>—</td></tr>
</table>
<div class="alert">Os demais ramos surgem das divisões e dos fascículos (lateral, posterior, medial), não diretamente dos troncos.</div>`},

{cat:5,src:"UNICH 23.1",b:"b-unc",q:"Túnel do carpo — conteúdo",a:`
<h4>Túnel do Carpo</h4>
Canal osteofibrótico no punho, formado pelos ossos do carpo (assoalho e paredes) e pelo <strong>retináculo dos flexores</strong> (teto).
<h4>Conteúdo (9 tendões + 1 nervo)</h4>
<ul>
  <li><strong>Tendões do flexor superficial dos dedos</strong> (4 tendões)</li>
  <li><strong>Tendões do flexor profundo dos dedos</strong> (4 tendões)</li>
  <li><strong>Tendão do flexor longo do polegar</strong> (1 tendão)</li>
  <li><strong>Nervo mediano</strong></li>
</ul>
<div class="alert">A artéria ulnar e o nervo ulnar NÃO passam pelo túnel do carpo — percorrem o canal de Guyon (medialmente).</div>`},

{cat:5,src:"UNICH 23.2",b:"b-unc",q:"Ramo dorsal do nervo ulnar — trajeto e território",a:`
<h4>Ramo Dorsal do N. Ulnar</h4>
<ul>
  <li>Origina do N. Ulnar ~5 cm proximal ao punho</li>
  <li>Passa dorsal ao tendão do flexor ulnar do carpo</li>
  <li>Contorna a borda medial do punho para o dorso da mão</li>
  <li><strong>Território sensitivo</strong>: face dorsal da mão (metade ulnar) + face dorsal dos dedos 4 e 5 e metade ulnar do 3º dedo (até as articulações IFP)</li>
</ul>`},

{cat:5,src:"UNICH 23.2",b:"b-unc",q:"Retorno venoso superficial do membro superior — onde começa",a:`
<h4>Sistema Venoso Superficial</h4>
Inicia-se na rede venosa dorsal da mão (plexo venoso dorsal).
<table>
  <tr><th>Veia</th><th>Origem</th><th>Trajeto</th><th>Drenagem</th></tr>
  <tr><td><strong>Cefálica</strong></td><td>Borda lateral da rede dorsal</td><td>Face lateral do antebraço → braço → sulco deltopeitoral</td><td>V. axilar (via v. cefálica acessória → v. axilar)</td></tr>
  <tr><td><strong>Basílica</strong></td><td>Borda medial da rede dorsal</td><td>Face medial antebraço → fossa cubital → braço medial</td><td>V. axilar (perfura a fáscia braquial)</td></tr>
  <tr><td><strong>Mediana do antebraço</strong></td><td>Face anterior do antebraço</td><td>Ascende medialmente</td><td>V. mediana cubital (conecta cefálica-basílica)</td></tr>
</table>
<div class="alert">V. mediana cubital: local de venopunção. Separa o n. mediano (medial) do tendão do bíceps (lateral).</div>`},

{cat:5,src:"UNICH 24.1",b:"b-unc",q:"Osso pisiforme — músculo que se insere, origem, inervação e ação",a:`
<h4>Osso Pisiforme</h4>
Osso sesamoide da fileira proximal do carpo, na borda ulnar. Artícula com o piramidal.
<h4>Músculo Inserido: Flexor Ulnar do Carpo</h4>
<table>
  <tr><th></th><th></th></tr>
  <tr><td><strong>Origem</strong></td><td>Epicôndilo medial (cabeça umeral) + olécrano e ulna posterior (cabeça ulnar)</td></tr>
  <tr><td><strong>Inserção</strong></td><td>Osso pisiforme (funciona como sesamoide para o tendão)</td></tr>
  <tr><td><strong>Ação</strong></td><td>Flexão e desvio ulnar do punho</td></tr>
  <tr><td><strong>Inervação</strong></td><td><strong>N. Ulnar</strong> (C7-C8)</td></tr>
</table>`},

{cat:5,src:"UNICH 24.1",b:"b-unc",q:"Divisão posterior do tronco inferior — todos os ramos do plexo braquial",a:`
<h4>Tronco Inferior (C8-T1)</h4>
Divisão anterior → contribui para o fascículo medial<br>
<strong>Divisão posterior</strong> → contribui para o fascículo posterior
<h4>Todos os Ramos do Plexo Braquial</h4>
<strong>Ramos dos troncos (diretos):</strong>
<ul>
  <li>N. supraescapular (tronco superior)</li>
  <li>N. para o subclávio (tronco superior)</li>
</ul>
<strong>Ramos dos fascículos:</strong>
<table>
  <tr><th>Fascículo</th><th>Ramos</th></tr>
  <tr><td>Lateral</td><td>N. musculocutâneo · N. peitoral lateral · Raiz lateral do mediano</td></tr>
  <tr><td>Medial</td><td>N. ulnar · N. cutâneo medial do braço · N. cutâneo medial do antebraço · N. peitoral medial · Raiz medial do mediano</td></tr>
  <tr><td>Posterior</td><td>N. axilar · N. radial · N. toracodorsal · N. subescapular superior · N. subescapular inferior</td></tr>
</table>`},

{cat:5,src:"UNICH 25.1",b:"b-unc",q:"Nervo ulnar — anastomose do cotovelo",a:`
<h4>N. Ulnar (C8-T1)</h4>
Origina do fascículo medial. Percorre o compartimento anterior do braço, passa pelo <strong>sulco do nervo ulnar</strong> (goteira epitroclear) no epicôndilo medial → antebraço → canal de Guyon no punho → mão.
<h4>Anastomose do Cotovelo</h4>
A <strong>rede anastomótica do cotovelo</strong> conecta ramos das artérias radial e ulnar para garantir circulação colateral:
<ul>
  <li>A. colateral ulnar superior e inferior (do úmero/braquial) + A. recorrente ulnar anterior e posterior</li>
  <li>A. colateral radial e média (braquial profunda) + A. recorrente radial e interóssea recorrente</li>
</ul>
Importância: preserva vascularização distal mesmo com ligaduras de vasos proximais.`},

{cat:5,src:"UNICH 25.1",b:"b-unc",q:"Pisiforme — músculo que se insere, inervação e ação",a:`
<h4>Pisiforme — Inserção Muscular</h4>
O <strong>Flexor Ulnar do Carpo</strong> insere-se no pisiforme (que funciona como osso sesamoide do seu tendão). O pisiforme serve ainda como origem para o <strong>abdutor do dedo mínimo</strong>.
<table>
  <tr><th></th><th>Flexor Ulnar do Carpo</th></tr>
  <tr><td>Inervação</td><td>N. Ulnar (C7-C8)</td></tr>
  <tr><td>Ação principal</td><td>Flexão + desvio ulnar do punho</td></tr>
</table>`},

// ── MEMBRO INFERIOR ──────────────────────────────────────────
{cat:6,src:"UNICH 26.1",b:"b-unc",q:"Tuberosidade do 5º metatarso — músculo que se insere, origem, ação e inervação",a:`
<h4>Tuberosidade do 5º Metatarso</h4>
Projeção óssea na base lateral do 5º metatarso (facilmente palpável). Local de inserção do fibular curto (peroneiro curto).
<h4>Músculo Fibular Curto (Peroneiro Curto)</h4>
<table>
  <tr><th></th><th></th></tr>
  <tr><td><strong>Origem</strong></td><td>Face lateral da fíbula (2/3 inferiores)</td></tr>
  <tr><td><strong>Inserção</strong></td><td>Tuberosidade da base do 5º metatarso</td></tr>
  <tr><td><strong>Ação</strong></td><td>Eversão do pé + flexão plantar (secundária)</td></tr>
  <tr><td><strong>Inervação</strong></td><td>N. fibular superficial (L5-S1)</td></tr>
</table>
<div class="alert">Fratura por avulsão da tuberosidade do 5º metatarso (fratura do "dancer") → tração do tendão do fibular curto em inversão forçada.</div>`},

{cat:6,src:"UNICH 26.1",b:"b-unc",q:"N. Safeno — raízes e ramos terminais do plexo lombar",a:`
<h4>Nervo Safeno</h4>
Maior ramo sensitivo do <strong>nervo femoral</strong> (L3-L4). Apenas sensitivo. Acompanha a artéria femoral no canal dos adutores (canal de Hunter), emerge no joelho, desce medialmente à perna e dorso medial do pé.
Sensitivo: face medial da perna e dorso medial do pé.
<h4>Plexo Lombar — Raízes e Ramos Terminais</h4>
<strong>Raízes:</strong> T12 (parcial), L1, L2, L3, L4 (parcial)
<table>
  <tr><th>Ramo</th><th>Raízes</th></tr>
  <tr><td>N. iliohipogástrico</td><td>L1 (T12)</td></tr>
  <tr><td>N. ilioinguinal</td><td>L1</td></tr>
  <tr><td>N. genitofemoral</td><td>L1-L2</td></tr>
  <tr><td>N. cutâneo lateral da coxa</td><td>L2-L3</td></tr>
  <tr><td><strong>N. femoral</strong></td><td>L2-L3-L4</td></tr>
  <tr><td><strong>N. obturatório</strong></td><td>L2-L3-L4</td></tr>
  <tr><td>Tronco lombossacral</td><td>L4-L5</td></tr>
</table>`},

{cat:6,src:"UFC 24.2",b:"b-ufc",q:"Lesão do nervo obturatório — comprometimento motor e sensitivo",a:`
<h4>Nervo Obturatório (L2-L3-L4)</h4>
Emerge medialmente ao psoas, entra na coxa pelo forame obturador, divide-se em ramos anterior e posterior.
<h4>Comprometimento Após Lesão</h4>
<table>
  <tr><th>Função</th><th>Déficit</th></tr>
  <tr><td><strong>Motor</strong></td><td>Fraqueza dos adutores da coxa (grácil, adutor longo, curto, magno — parte), obturador externo → dificuldade de adução e rotação medial da coxa</td></tr>
  <tr><td><strong>Sensitivo</strong></td><td>Perda de sensibilidade na <strong>face medial da coxa</strong></td></tr>
  <tr><td><strong>Marcha</strong></td><td>Marcha com pernas abertas (tesoura invertida), instabilidade</td></tr>
</table>
<div class="alert">Lesão comum em: parto (cabeça fetal sobre o nervo), cirurgia pélvica, hérnia obturatória.</div>`},

{cat:6,src:"UFC 24.2",b:"b-ufc",q:"Inervação da perna — todos os nervos por compartimento",a:`
<h4>Inervação dos Compartimentos da Perna</h4>
<table>
  <tr><th>Compartimento</th><th>Nervo</th><th>Músculos</th></tr>
  <tr><td><strong>Anterior</strong></td><td>N. fibular profundo (L4-L5)</td><td>Tibial anterior, extensor longo dos dedos, extensor longo do hálux, fibular terceiro</td></tr>
  <tr><td><strong>Lateral</strong></td><td>N. fibular superficial (L5-S1)</td><td>Fibular longo, fibular curto</td></tr>
  <tr><td><strong>Posterior superficial</strong></td><td>N. tibial (S1-S2)</td><td>Gastrocnêmio, sóleo, plantar</td></tr>
  <tr><td><strong>Posterior profundo</strong></td><td>N. tibial (L4-S2)</td><td>Flexor longo dos dedos, flexor longo do hálux, tibial posterior, poplíteo</td></tr>
</table>`},

{cat:6,src:"UFC 2015",b:"b-ufc",q:"Comprometimento na lesão do nervo fibular profundo",a:`
<h4>N. Fibular Profundo (L4-L5)</h4>
Inerva os músculos do compartimento anterior da perna + músculos do dorso do pé.
<h4>Lesão — Comprometimento</h4>
<ul>
  <li><strong>Motor</strong>: paralisia dos dorsiflexores do pé e extensores dos dedos → <strong>pé caído</strong> (foot drop)</li>
  <li><strong>Marcha</strong>: marcha escarvante (steppage gait) — eleva excessivamente o joelho para compensar o arrasto do pé</li>
  <li><strong>Sensitivo</strong>: perda da sensibilidade apenas no <strong>1º espaço interdigital</strong> (entre 1º e 2º dedos)</li>
</ul>
<div class="alert">Causa comum: compressão pelo retináculo dos extensores, fratura da cabeça da fíbula, uso prolongado de curativo gessado.</div>`},

{cat:6,src:"UFC 2015",b:"b-ufc",q:"Irrigação de cada compartimento da perna e seus ramos no pé",a:`
<h4>Irrigação dos Compartimentos</h4>
<table>
  <tr><th>Compartimento</th><th>Artéria</th><th>Origem</th></tr>
  <tr><td>Anterior</td><td>A. tibial anterior</td><td>A. poplítea (bifurca no anel do sóleo)</td></tr>
  <tr><td>Lateral</td><td>Ramos fibulares (peroneiros)</td><td>A. fibular (peroneira) — ramo da tibial posterior</td></tr>
  <tr><td>Posterior</td><td>A. tibial posterior + A. fibular</td><td>A. poplítea</td></tr>
</table>
<h4>Ramos no Pé</h4>
<ul>
  <li>A. tibial anterior → <strong>A. dorsal do pé</strong> → arco dorsal do pé → Aa. metatarsais dorsais</li>
  <li>A. tibial posterior → contorna o maléolo medial → <strong>Aa. plantar medial e lateral</strong> → A. plantar lateral forma o <strong>arco plantar profundo</strong></li>
</ul>`},

{cat:6,src:"UFC 2015",b:"b-ufc",q:"Limites e conteúdos do trígono femoral",a:`
<h4>Trígono (Triângulo) Femoral</h4>
<h4>Limites</h4>
<table>
  <tr><th>Limite</th><th>Estrutura</th></tr>
  <tr><td>Superior (base)</td><td>Ligamento inguinal</td></tr>
  <tr><td>Lateral</td><td>Borda medial do sartório</td></tr>
  <tr><td>Medial</td><td>Borda lateral do adutor longo</td></tr>
  <tr><td>Teto</td><td>Fáscia lata + fáscia cribriforme (sobre o hiato safeno)</td></tr>
  <tr><td>Assoalho</td><td>Ilíopsoas (lateral) + pectíneo (medial)</td></tr>
</table>
<h4>Conteúdo (lateral → medial)</h4>
<span class="pill">N. Femoral</span><span class="pill">A. Femoral</span><span class="pill">V. Femoral</span><span class="pill">Canal femoral (linfáticos)</span>
<div class="alert">Macete: <strong>NAVe</strong> — Nervo · Artéria · Veia (lat → med). O canal femoral é o espaço medial à bainha femoral.</div>`},

{cat:6,src:"UNICH 23.2",b:"b-unc",q:"Nervo obturatório — lesão e comprometimento",a:`
<h4>Nervo Obturatório (L2-L3-L4)</h4>
<h4>Comprometimento Motor</h4>
<ul>
  <li>Paralisia dos <strong>adutores da coxa</strong>: adutor longo, curto, magno (parte), grácil, obturador externo</li>
  <li>Fraqueza de adução e rotação medial da coxa</li>
</ul>
<h4>Comprometimento Sensitivo</h4>
Anestesia/hipoestesia na <strong>face medial da coxa</strong> (ramo cutâneo anterior do obturatório).
<h4>Causas Comuns de Lesão</h4>
<ul>
  <li>Cirurgia pélvica (histerectomia, ressecção de próstata)</li>
  <li>Parto prolongado</li>
  <li>Hérnia obturatória (sinal de Howship-Romberg: dor face medial da coxa)</li>
</ul>`},

{cat:6,src:"UNICH 23.2",b:"b-unc",q:"Inervação e vascularização dos compartimentos da perna",a:`
<h4>Compartimento Anterior</h4>
Nervo: <strong>Fibular profundo</strong> (L4-L5) | Artéria: <strong>Tibial anterior</strong>
<h4>Compartimento Lateral</h4>
Nervo: <strong>Fibular superficial</strong> (L5-S1) | Artéria: ramos da <strong>fibular (peroneira)</strong>
<h4>Compartimento Posterior Superficial</h4>
Nervo: <strong>Tibial</strong> (S1-S2) | Artéria: <strong>Tibial posterior</strong> e fibular
<h4>Compartimento Posterior Profundo</h4>
Nervo: <strong>Tibial</strong> (L4-S2) | Artéria: <strong>Tibial posterior</strong> e fibular`},

{cat:6,src:"UNICH 24.1",b:"b-unc",q:"Retináculo dos fibulares — conteúdo e limites da fossa poplítea",a:`
<h4>Retináculo dos Fibulares</h4>
Espessamentos da fáscia profunda que retêm os tendões dos músculos fibulares longo e curto atrás do maléolo lateral.
<ul>
  <li><strong>Retináculo superior</strong>: maléolo lateral → calcâneo (superior)</li>
  <li><strong>Retináculo inferior</strong>: calcâneo → fáscia do pé (inferior)</li>
  <li><strong>Conteúdo</strong>: tendões do fibular longo e fibular curto + bainha sinovial</li>
</ul>
<h4>Limites da Fossa Poplítea (losango)</h4>
<table>
  <tr><th>Limite</th><th>Estrutura</th></tr>
  <tr><td>Superolateral</td><td>Bíceps femoral</td></tr>
  <tr><td>Superomedial</td><td>Semitendíneo + semimembranoso</td></tr>
  <tr><td>Inferolateral</td><td>Cabeça lateral do gastrocnêmio</td></tr>
  <tr><td>Inferomedial</td><td>Cabeça medial do gastrocnêmio</td></tr>
  <tr><td>Teto</td><td>Fáscia poplítea</td></tr>
  <tr><td>Assoalho</td><td>Côndilo femoral + cápsula articular + músculo poplíteo</td></tr>
</table>
<h4>Conteúdo</h4>
A. e V. poplíteas · N. tibial · N. fibular comum · Vasos linfáticos · Gordura`},

{cat:6,src:"UNICH 24.1",b:"b-unc",q:"Artéria tibial posterior — vascularização da perna e ramo principal do pé",a:`
<h4>Artéria Tibial Posterior</h4>
Ramo terminal medial da A. poplítea (na abertura do arco do sóleo). Desce no compartimento posterior profundo da perna. Contorna o <strong>maléolo medial</strong> pelo túnel do tarso → divide-se nas <strong>artérias plantares medial e lateral</strong>.
<h4>Ramos na Perna</h4>
<ul>
  <li>A. fibular (peroneira): maior ramo, irriga compartimentos lateral e posterior</li>
  <li>Ramos musculares para o compartimento posterior</li>
  <li>A. nutriente da fíbula</li>
</ul>
<h4>Ramo Principal do Pé</h4>
A. plantar lateral (dominant) → forma o <strong>arco plantar profundo</strong> com o ramo plantar profundo da A. dorsal do pé → Aa. metatarsais plantares → Aa. digitais plantares.`},

{cat:6,src:"UNICH 25.1",b:"b-unc",q:"Tuberosidade do 5º metatarso — músculo que se insere, inervação, ação e origem",a:`
<h4>Músculo Fibular Curto</h4>
<table>
  <tr><th></th><th></th></tr>
  <tr><td><strong>Origem</strong></td><td>Face lateral da fíbula (2/3 inferiores)</td></tr>
  <tr><td><strong>Inserção</strong></td><td>Tuberosidade da base do 5º metatarso</td></tr>
  <tr><td><strong>Ação</strong></td><td>Eversão do pé + assistência na flexão plantar</td></tr>
  <tr><td><strong>Inervação</strong></td><td>N. fibular superficial (L5-S1)</td></tr>
</table>`},

// ── COLUNA E DORSO ────────────────────────────────────────────
{cat:7,src:"UFC 24.2",b:"b-ufc",q:"Todos os ligamentos da coluna vertebral",a:`
<h4>Ligamentos Longitudinais</h4>
<ul>
  <li><strong>Lig. longitudinal anterior</strong>: anterior aos corpos vertebrais (atlas ao sacro) — limita extensão</li>
  <li><strong>Lig. longitudinal posterior</strong>: posterior aos corpos (dentro do canal) — limita flexão</li>
</ul>
<h4>Ligamentos do Arco Vertebral</h4>
<ul>
  <li><strong>Lig. amarelo (ligamentum flavum)</strong>: une lâminas adjacentes — fibras elásticas, limita flexão</li>
  <li><strong>Lig. interespinhoso</strong>: entre processos espinhosos adjacentes</li>
  <li><strong>Lig. supraespinhoso</strong>: une ápices dos processos espinhosos (C7 ao sacro) — na cervical = lig. da nuca</li>
  <li><strong>Lig. intertransverso</strong>: entre processos transversos</li>
</ul>
<h4>Ligamentos das Articulações Zigoapofisárias</h4>
Cápsulas articulares entre as facetas articulares.
<h4>Ligamentos Especiais da Coluna Cervical</h4>
<ul>
  <li><strong>Lig. transverso do atlas</strong>: mantém o dente do áxis</li>
  <li><strong>Lig. cruciforme</strong>: transverso + longitudinal (superior e inferior)</li>
  <li><strong>Lig. alar</strong>: dente do áxis → côndilo occipital</li>
  <li><strong>Lig. apical do dente</strong>: ápice do dente → clivo do occipital</li>
  <li><strong>Membrana tectorial</strong>: continuação do lig. longitudinal posterior</li>
  <li><strong>Membrana atlantooccipital anterior e posterior</strong></li>
</ul>`},

{cat:7,src:"UFC 2015",b:"b-ufc",q:"Todos os ligamentos da coluna vertebral",a:`
<h4>Ligamentos Principais</h4>
<strong>Longitudinais:</strong> Lig. longitudinal anterior (limita extensão) + Lig. longitudinal posterior (limita flexão)
<strong>Entre arcos:</strong> Lig. amarelo (flavum) + Lig. interespinhoso + Lig. supraespinhoso + Lig. intertransverso
<h4>Ligamentos Cervicais Especiais (C0-C2)</h4>
Lig. transverso do atlas · Lig. alar (par) · Lig. apical do dente · Membrana tectorial · Membranas atlantooccipitais anterior e posterior · Lig. da nuca (supraespinhoso cervical expandido)
<div class="alert">Lig. flavum: único com predomínio de fibras elásticas. Hipertrofia do lig. flavum → estenose do canal raquidiano.</div>`},

{cat:7,src:"UNICH 23.2",b:"b-unc",q:"Ligamentos entre as vértebras",a:`
<h4>Ligamentos Intervertebrais</h4>
<table>
  <tr><th>Ligamento</th><th>Localização</th><th>Função</th></tr>
  <tr><td>Lig. longitudinal anterior</td><td>Face anterior dos corpos vertebrais</td><td>Limita extensão</td></tr>
  <tr><td>Lig. longitudinal posterior</td><td>Face posterior dos corpos (canal vertebral)</td><td>Limita flexão, suporta disco</td></tr>
  <tr><td>Lig. amarelo</td><td>Entre lâminas adjacentes</td><td>Limita flexão, fecha canal</td></tr>
  <tr><td>Lig. interespinhoso</td><td>Entre processos espinhosos</td><td>Limita flexão</td></tr>
  <tr><td>Lig. supraespinhoso</td><td>Sobre ápices dos espinhosos</td><td>Limita flexão</td></tr>
  <tr><td>Lig. intertransverso</td><td>Entre processos transversos</td><td>Limita flexão lateral</td></tr>
  <tr><td>Disco intervertebral</td><td>Entre corpos vertebrais</td><td>Absorção de choque, mobilidade</td></tr>
</table>`},
];

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

CATS.forEach((cat, ci) => {
  const items = QS.filter(q => q.cat === ci);
  const tab = document.createElement('button');
  tab.className = 'tab' + (ci===0?' active':'');
  tab.innerHTML = cat + '<span class="cnt">(' + items.length + ')</span>';
  tab.dataset.ci = ci;
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('p' + ci).classList.add('active');
  };
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'panel' + (ci===0?' active':'');
  panel.id = 'p' + ci;

  const header = document.createElement('div');
  header.className = 'section-title';
  header.innerHTML = '<span>' + items.length + ' questões</span><span class="expand-all" onclick="expandAll('+ci+')">Expandir todas</span>';
  panel.appendChild(header);

  items.forEach((item, ji) => {
    const gid = 'c' + ci + 'q' + ji;
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.q = (item.q + ' ' + item.a).toLowerCase();
    card.innerHTML =
      '<div class="q-header" onclick="toggle(\'' + gid + '\')">' +
        '<span class="badge ' + item.b + '">' + item.src + '</span>' +
        '<span class="q-title">' + item.q + '</span>' +
        '<span class="q-arrow" id="ar_' + gid + '">▼</span>' +
      '</div>' +
      '<div class="q-body" id="b_' + gid + '">' + item.a + '</div>';
    panel.appendChild(card);
  });
  panelsEl.appendChild(panel);
});

window.toggle = function(gid) {
  const body = document.getElementById('b_' + gid);
  const arrow = document.getElementById('ar_' + gid);
  const card = body.closest('.q-card');
  const open = body.style.display === 'block';
  body.style.display = open ? 'none' : 'block';
  arrow.style.transform = open ? '' : 'rotate(180deg)';
  card.classList.toggle('open', !open);
};

window.expandAll = function(ci) {
  const panel = document.getElementById('p' + ci);
  panel.querySelectorAll('.q-body').forEach(b => b.style.display = 'block');
  panel.querySelectorAll('.q-arrow').forEach(a => a.style.transform = 'rotate(180deg)');
  panel.querySelectorAll('.q-card').forEach(c => c.classList.add('open'));
};

window.filterSearch = function() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll('.q-card').forEach(c => c.style.display = '');
    return;
  }
  // Show all panels and search across all
  document.querySelectorAll('.panel').forEach(p => p.classList.add('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.q-card').forEach(c => {
    c.style.display = c.dataset.q.includes(q) ? '' : 'none';
  });
};

window.setMode = function(mode) {
  const gabEl = document.getElementById('panels');
  const tabsEl2 = document.getElementById('tabs');
  const fcEl = document.getElementById('fc-view');
  const searchBar = document.querySelector('.search-bar');
  const btnG = document.getElementById('btn-gabarito');
  const btnF = document.getElementById('btn-flashcard');
  if (mode === 'flashcard') {
    gabEl.style.display = 'none';
    tabsEl2.style.display = 'none';
    searchBar.style.display = 'none';
    fcEl.style.display = 'block';
    btnG.classList.remove('active');
    btnF.classList.add('active');
    fcInit();
  } else {
    gabEl.style.display = '';
    tabsEl2.style.display = '';
    searchBar.style.display = '';
    fcEl.style.display = 'none';
    btnG.classList.add('active');
    btnF.classList.remove('active');
  }
};

const fcResults = {};
let fcDeck = [];
let fcIdx = 0;
let fcFlipped = false;

(function buildFcSelect() {
  const sel = document.getElementById('fc-cat-sel');
  CATS.forEach((cat, ci) => {
    const opt = document.createElement('option');
    opt.value = ci;
    opt.textContent = cat;
    sel.appendChild(opt);
  });
})();

window.fcInit = function() {
  const catVal = parseInt(document.getElementById('fc-cat-sel').value);
  const shuffle = document.getElementById('fc-shuffle').checked;
  const onlyWrong = document.getElementById('fc-only-wrong').checked;

  let pool = catVal === -1 ? QS : QS.filter(q => q.cat === catVal);
  if (onlyWrong) {
    pool = pool.filter(q => {
      const id = q.cat + '_' + QS.indexOf(q);
      return fcResults[id] === 'wrong' || fcResults[id] === 'review';
    });
  }
  if (shuffle) {
    pool = [...pool].sort(() => Math.random() - 0.5);
  }
  fcDeck = pool;
  fcIdx = 0;
  document.getElementById('fc-done').style.display = 'none';
  document.getElementById('fc-wrap').style.display = 'block';
  document.getElementById('fc-counter').style.display = 'block';
  document.getElementById('fc-progress-bar').style.display = 'block';
  fcShowCard();
  fcUpdateStats();
};

function fcShowCard() {
  if (!fcDeck.length) {
    fcShowDone();
    return;
  }
  const item = fcDeck[fcIdx];
  fcFlipped = false;
  const card = document.getElementById('fc-card');
  card.classList.remove('flipped');
  document.getElementById('fc-q').textContent = item.q;
  document.getElementById('fc-a').innerHTML = item.a;
  const badge = document.getElementById('fc-badge-back');
  badge.textContent = item.src;
  badge.className = 'badge ' + item.b;
  document.getElementById('fc-actions').style.display = 'none';
  document.getElementById('fc-wrap').style.pointerEvents = 'auto';

  const total = fcDeck.length;
  const pct = total > 0 ? ((fcIdx) / total * 100).toFixed(0) : 0;
  document.getElementById('fc-prog').style.width = pct + '%';
  document.getElementById('fc-counter').innerHTML =
    '<strong>' + (fcIdx + 1) + '</strong> de <strong>' + total + '</strong>';
}

window.fcFlip = function() {
  if (fcFlipped) return;
  fcFlipped = true;
  document.getElementById('fc-card').classList.add('flipped');
  document.getElementById('fc-actions').style.display = 'flex';
  document.getElementById('fc-wrap').style.pointerEvents = 'none';
};

window.fcRate = function(result) {
  const item = fcDeck[fcIdx];
  const id = item.cat + '_' + QS.indexOf(item);
  fcResults[id] = result;
  fcIdx++;
  if (fcIdx >= fcDeck.length) {
    fcShowDone();
  } else {
    fcShowCard();
  }
  fcUpdateStats();
};

function fcUpdateStats() {
  const total = Object.keys(fcResults).length;
  const right = Object.values(fcResults).filter(v => v === 'right').length;
  const wrong = Object.values(fcResults).filter(v => v === 'wrong').length;
  const review = Object.values(fcResults).filter(v => v === 'review').length;
  if (total === 0) { document.getElementById('fc-stats').textContent = ''; return; }
  document.getElementById('fc-stats').innerHTML =
    '<span style="color:#2e7d32">✓ ' + right + '</span> &nbsp;' +
    '<span style="color:#f57f17">~ ' + review + '</span> &nbsp;' +
    '<span style="color:#c62828">✗ ' + wrong + '</span>';
}

function fcShowDone() {
  document.getElementById('fc-wrap').style.display = 'none';
  document.getElementById('fc-actions').style.display = 'none';
  document.getElementById('fc-counter').style.display = 'none';
  document.getElementById('fc-prog').style.width = '100%';

  const total = fcDeck.length;
  let right = 0, wrong = 0, review = 0;
  fcDeck.forEach(item => {
    const id = item.cat + '_' + QS.indexOf(item);
    const r = fcResults[id];
    if (r === 'right') right++;
    else if (r === 'wrong') wrong++;
    else if (r === 'review') review++;
  });

  const pct = total > 0 ? Math.round(right / total * 100) : 0;
  let emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📖';
  let msg = pct >= 80 ? 'Excelente desempenho!' : pct >= 50 ? 'Bom progresso, continue!' : 'Revise os conteúdos marcados!';

  document.getElementById('fc-done').style.display = 'block';
  document.getElementById('fc-done').innerHTML =
    '<div style="font-size:40px;margin-bottom:.5rem">' + emoji + '</div>' +
    '<h2>' + msg + '</h2>' +
    '<p>' + total + ' cartões estudados &nbsp;·&nbsp; ' + pct + '% de acerto</p>' +
    '<div class="score-grid">' +
      '<div class="score-box"><div class="val green">' + right + '</div><div class="lbl">Acertei</div></div>' +
      '<div class="score-box"><div class="val yellow">' + review + '</div><div class="lbl">Revisar</div></div>' +
      '<div class="score-box"><div class="val red">' + wrong + '</div><div class="lbl">Errei</div></div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      (wrong + review > 0 ? '<button class="fc-btn red" onclick="document.getElementById(\'fc-only-wrong\').checked=true;fcInit()">Repetir erradas/revisar</button>' : '') +
      '<button class="fc-restart" onclick="document.getElementById(\'fc-only-wrong\').checked=false;fcInit()">Reiniciar baralho</button>' +
    '</div>';
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('fc-view').style.display === 'none') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!fcFlipped) fcFlip(); }
  if (fcFlipped) {
    if (e.key === '1') fcRate('wrong');
    if (e.key === '2') fcRate('review');
    if (e.key === '3') fcRate('right');
  }
});
</script>
</body>
