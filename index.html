<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabarito Monitoria de Anatomia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f5ee;
    --bg2: #fffdf8;
    --bg3: #efe6d9;
    --text: #1d1c1a;
    --text2: #5c5245;
    --text3: #8f8373;
    --border: rgba(103, 87, 66, 0.18);
    --border2: rgba(103, 87, 66, 0.34);
    --unc-bg: #f5ebd5;
    --unc-c: #6b4f17;
    --ufc-bg: #d9f1ea;
    --ufc-c: #0a5b4a;
    --radius: 14px;
    --shadow: 0 12px 28px rgba(32, 24, 14, 0.08);
  }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background:
      radial-gradient(circle at 8% 8%, #fff3d8 0, transparent 26%),
      radial-gradient(circle at 92% 12%, #d8efe9 0, transparent 28%),
      linear-gradient(165deg, var(--bg) 0%, var(--bg3) 100%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: color-mix(in srgb, var(--bg2) 86%, #ffffff 14%);
    backdrop-filter: blur(5px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: clamp(1rem, 2vw, 1.45rem);
    font-weight: 700;
    letter-spacing: .01em;
  }
  header p { font-size: 12px; color: var(--text3); margin-top: 4px; }
  .search-bar { margin-top: 12px; display: flex; gap: 8px; }
  .search-bar input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: var(--bg2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-bar input:focus { border-color: #8b704b; box-shadow: 0 0 0 3px rgba(139, 112, 75, 0.16); }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 1rem 1.5rem .7rem;
    background: transparent;
    position: sticky;
    top: 92px;
    z-index: 90;
  }
  .tab {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: var(--bg2);
    color: var(--text2);
    transition: all .18s;
    white-space: nowrap;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab.active { background: #3b2f21; color: #fffaf1; border-color: #3b2f21; }
  .tab .cnt { font-size: 10px; opacity: .65; margin-left: 4px; }
  .panel { display: none; padding: .6rem 1.5rem 3rem; max-width: 1120px; margin: 0 auto; }
  .panel.active { display: block; }
  .q-card {
    background: color-mix(in srgb, var(--bg2) 82%, white 18%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: cardIn .28s ease both;
  }
  .q-header { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .q-header:hover { background: #fff6e8; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; font-weight: 600; }
  .b-unc { background: var(--unc-bg); color: var(--unc-c); }
  .b-ufc { background: var(--ufc-bg); color: var(--ufc-c); }
  .q-title { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.5; }
  .q-arrow { font-size: 11px; color: var(--text3); margin-top: 3px; flex-shrink: 0; transition: transform .2s; }
  .q-body {
    display: none;
    border-top: 1px solid var(--border);
    background: #fffaf3;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.8;
    font-family: 'Literata', serif;
  }
  .q-card.open .q-arrow { transform: rotate(180deg); }
  .q-card.open .q-body { display: block; }
  .q-body h4 { font-size: 13px; font-weight: 600; margin: 12px 0 5px; color: var(--text); }
  .q-body h4:first-child { margin-top: 0; }
  .q-body ul { padding-left: 18px; margin: 4px 0 8px; }
  .q-body li { margin-bottom: 4px; }
  .q-body table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; background: #fff; }
  .q-body td, .q-body th { padding: 6px 9px; border: 1px solid var(--border); text-align: left; }
  .q-body th { background: #f4ecde; font-weight: 600; }
  .q-body .pill { display: inline-block; background: #f4ecde; border-radius: 6px; padding: 2px 8px; font-size: 11px; margin: 2px; border: 1px solid var(--border); }
  .q-body .alert { background: #fff2d8; border-left: 3px solid #d08f1a; padding: 8px 12px; border-radius: 4px; margin: 8px 0; font-size: 12px; color: #5c5245; }
  .no-results { text-align: center; padding: 3rem; color: var(--text3); font-size: 14px; }
  strong { font-weight: 600; }
  .expand-all { float: right; font-size: 11px; color: var(--text3); cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); margin-top: -2px; }
  .expand-all:hover { color: var(--text); }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

  .mode-toggle { display: flex; gap: 6px; margin-top: 10px; }
  .mode-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border2); font-size: 12px; cursor: pointer; background: var(--bg2); color: var(--text2); transition: all .15s; }
  .mode-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  #fc-view { display: none; padding: 1.5rem; max-width: 720px; margin: 0 auto; }
  .fc-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.2rem; align-items: center; }
  .fc-controls select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg); color: var(--text); font-size: 12px; outline: none; }
  .fc-controls label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .fc-stats { margin-left: auto; font-size: 12px; color: var(--text3); }
  .fc-stats span { font-weight: 600; color: var(--text); }

  .fc-card-wrap { perspective: 1200px; width: 100%; min-height: 340px; margin-bottom: 1.2rem; cursor: pointer; }
  .fc-card { position: relative; width: 100%; min-height: 340px; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .fc-card.flipped { transform: rotateY(180deg); }
  .fc-front, .fc-back {
    position: absolute; top: 0; left: 0; width: 100%; min-height: 340px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 2rem; display: flex; flex-direction: column;
  }
  .fc-back { transform: rotateY(180deg); overflow-y: auto; }
  .fc-face-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); margin-bottom: 1rem; font-weight: 600; }
  .fc-question { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; flex: 1; display: flex; align-items: center; }
  .fc-hint { font-size: 11px; color: var(--text3); margin-top: 1.2rem; text-align: center; }
  .fc-answer { font-size: 13px; line-height: 1.75; color: var(--text); flex: 1; }
  .fc-answer h4 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .fc-answer h4:first-child { margin-top: 0; }
  .fc-answer ul { padding-left: 16px; margin: 4px 0 8px; }
  .fc-answer li { margin-bottom: 3px; }
  .fc-answer table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .fc-answer td, .fc-answer th { padding: 5px 8px; border: 1px solid var(--border); text-align: left; }
  .fc-answer th { background: var(--bg3); font-weight: 600; }
  .fc-answer .pill { display: inline-block; background: var(--bg3); border-radius: 6px; padding: 2px 8px; font-size: 11px; margin: 2px; border: 1px solid var(--border); }
  .fc-answer .alert { background: #fff8e1; border-left: 3px solid #f9a825; padding: 7px 10px; border-radius: 4px; margin: 8px 0; font-size: 12px; color: #555; }
  @media (prefers-color-scheme: dark) { .fc-answer .alert { background: #2e2a00; color: #ccc; } }
  .fc-badge { display: inline-flex; align-items: center; gap: 4px; }

  .fc-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .fc-btn { padding: 9px 22px; border-radius: 10px; border: 1px solid var(--border2); font-size: 13px; font-weight: 500; cursor: pointer; background: var(--bg); color: var(--text2); transition: all .15s; }
  .fc-btn:hover { background: var(--bg2); }
  .fc-btn.green { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
  .fc-btn.green:hover { background: #c8e6c9; }
  .fc-btn.red { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
  .fc-btn.red:hover { background: #ffcdd2; }
  .fc-btn.yellow { background: #fffde7; color: #f57f17; border-color: #fff176; }
  .fc-btn.yellow:hover { background: #fff9c4; }
  @media (prefers-color-scheme: dark) {
    .fc-btn.green { background: #1b3a1d; color: #81c784; border-color: #388e3c; }
    .fc-btn.green:hover { background: #243d25; }
    .fc-btn.red { background: #3b1a1a; color: #e57373; border-color: #c62828; }
    .fc-btn.red:hover { background: #4a2020; }
    .fc-btn.yellow { background: #3a2e00; color: #ffd54f; border-color: #f9a825; }
    .fc-btn.yellow:hover { background: #4a3a00; }
  }

  .fc-progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .fc-progress-fill { height: 100%; background: var(--text); border-radius: 2px; transition: width .3s; }

  .fc-counter { text-align: center; font-size: 12px; color: var(--text3); margin-bottom: 1rem; }
  .fc-counter strong { color: var(--text); }

  .fc-done { text-align: center; padding: 3rem 1rem; }
  .fc-done h2 { font-size: 22px; margin-bottom: 0.5rem; }
  .fc-done p { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }
  .fc-done .score-grid { display: flex; gap: 12px; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .fc-done .score-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.5rem; text-align: center; }
  .fc-done .score-box .val { font-size: 28px; font-weight: 600; }
  .fc-done .score-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .fc-done .val.green { color: #2e7d32; }
  .fc-done .val.red { color: #c62828; }
  .fc-done .val.yellow { color: #f57f17; }
  @media (prefers-color-scheme: dark) {
    .fc-done .val.green { color: #81c784; }
    .fc-done .val.red { color: #e57373; }
    .fc-done .val.yellow { color: #ffd54f; }
  }
  .fc-restart { padding: 9px 24px; border-radius: 10px; border: 1px solid var(--border2); font-size: 13px; font-weight: 500; cursor: pointer; background: var(--text); color: var(--bg); }
  .fc-restart:hover { opacity: .85; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 900px) {
    header { padding: .9rem 1rem; }
    .tabs { top: 86px; padding: .75rem 1rem .6rem; overflow-x: auto; flex-wrap: nowrap; }
    .panel { padding: .5rem 1rem 2rem; }
    .q-header { padding: 12px 12px; }
    .q-title { font-size: 13px; }
    .q-body { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>📚 Gabarito — Monitoria de Anatomia</h1>
  <p>UNICHRISTUS &amp; UFC · 2015–2026 · Questões organizadas por tema</p>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar questão ou conteúdo..." oninput="filterSearch()">
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-gabarito" onclick="setMode('gabarito')">📋 Gabarito</button>
    <button class="mode-btn" id="btn-flashcard" onclick="setMode('flashcard')">🃏 Flashcards</button>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<div id="fc-view">
  <div class="fc-controls">
    <select id="fc-cat-sel" onchange="fcInit()">
      <option value="-1">Todas as categorias</option>
    </select>
    <label><input type="checkbox" id="fc-shuffle" onchange="fcInit()" checked> Embaralhar</label>
    <label><input type="checkbox" id="fc-only-wrong" onchange="fcInit()"> So erradas/revisar</label>
    <span class="fc-stats" id="fc-stats"></span>
  </div>
  <div class="fc-progress-bar" id="fc-progress-bar"><div class="fc-progress-fill" id="fc-prog"></div></div>
  <div class="fc-counter" id="fc-counter"></div>
  <div class="fc-card-wrap" id="fc-wrap" onclick="fcFlip()">
    <div class="fc-card" id="fc-card">
      <div class="fc-front">
        <div class="fc-face-label">Pergunta</div>
        <div class="fc-question" id="fc-q"></div>
        <div class="fc-hint">Clique para revelar a resposta</div>
      </div>
      <div class="fc-back">
        <div class="fc-face-label fc-badge">Resposta <span id="fc-badge-back" class="badge" style="margin-top:0;margin-left:4px"></span></div>
        <div class="fc-answer" id="fc-a"></div>
      </div>
    </div>
  </div>
  <div class="fc-actions" id="fc-actions" style="display:none">
    <button class="fc-btn red" onclick="fcRate('wrong')">✗ Errei</button>
    <button class="fc-btn yellow" onclick="fcRate('review')">~ Revisar</button>
    <button class="fc-btn green" onclick="fcRate('right')">✓ Acertei</button>
  </div>
  <div id="fc-done" class="fc-done" style="display:none"></div>
</div>

<script>
const CATS = [
  "🧠 Neuroanatomia",
  "🦷 Cabeça e Pescoço",
  "🫁 Tórax e Coração",
  "🫃 Abdome",
  "🍑 Pelve e Períneo",
  "💪 Membro Superior",
  "🦵 Membro Inferior",
  "🦴 Coluna e Dorso"
];

const QS = [
// ── NEUROANATOMIA ──────────────────────────────────────────────
{cat:0,src:"UNICH 26.1",b:"b-unc",q:"Área septal — onde está o cúneo e sua principal função",a:`
<h4>Área Septal</h4>
Localizada na face medial do hemisfério cerebral, abaixo do joelho do corpo caloso (região subcalosa). Inclui o <strong>giro subcaloso</strong> e os <strong>núcleos septais</strong>. Faz parte do sistema límbico e está envolvida em comportamento emocional, prazer e modulação do hipocampo.
<h4>Cúneo</h4>
Localizado no <strong>lobo occipital</strong>, na face medial do hemisfério, entre o <strong>sulco parietooccipital</strong> (superior) e o <strong>sulco calcarino</strong> (inferior).
<h4>Função do Cúneo</h4>
<ul>
  <li>Processamento visual do <strong>campo visual inferior contralateral</strong></li>
  <li>Parte da área visual primária (área 17 de Brodmann)</li>
  <li>Lesão: <strong>quadrantanopsia inferior contralateral</strong></li>
</ul>`},

{cat:0,src:"UNICH 26.1",b:"b-unc",q:"Sulco occipitotemporal — explique a área motora primária: localização e lesões",a:`
<h4>Sulco Occipitotemporal</h4>
Separa o <strong>giro fusiforme</strong> (occipitotemporal lateral) do <strong>giro parahipocampal</strong>, na face inferior do lobo temporal.
<h4>Área Motora Primária (M1)</h4>
<ul>
  <li>Localização: <strong>giro pré-central</strong> (área 4 de Brodmann), anterior ao sulco central</li>
  <li>Organização somatotópica — Homúnculo de Penfield (medial → lateral): MMII → tronco → MMSS → face/língua</li>
</ul>
<h4>Lesões</h4>
<table>
  <tr><th>Tipo</th><th>Manifestação</th></tr>
  <tr><td>Unilateral</td><td>Hemiplegia/hemiparesia <strong>contralateral espástica</strong> (NMS)</td></tr>
  <tr><td>Bilateral da área da face</td><td>Disfagia, disartria</td></tr>
  <tr><td>Área do MMII (lobo paracentral)</td><td>Paraplegia + disfunção vesical</td></tr>
</table>`},

{cat:0,src:"UFC 24.2",b:"b-ufc",q:"Composição do sistema límbico",a:`
<h4>Estruturas Corticais</h4>
<ul>
  <li>Hipocampo (Corno de Amon — CA1 a CA4)</li>
  <li>Giro dentado e Subículo</li>
  <li>Córtex entorrinal</li>
  <li>Giro parahipocampal</li>
  <li>Giro do cíngulo (córtex cingulado)</li>
  <li>Córtex piriforme (lobo piriforme)</li>
</ul>
<h4>Estruturas Subcorticais</h4>
<ul>
  <li>Amígdala (complexo amigdaloide)</li>
  <li>Hipotálamo (especialmente corpos mamilares)</li>
  <li>Tálamo (núcleo anterior)</li>
  <li>Área septal</li>
  <li>Núcleo accumbens</li>
  <li>Fórnice (principal via eferente do hipocampo)</li>
</ul>
<h4>Circuito de Papez</h4>
Hipocampo → Fórnice → Corpos Mamilares → Núcleo Anterior do Tálamo → Giro do Cíngulo → Córtex Entorrinal → Hipocampo`},

{cat:0,src:"UFC 24.2",b:"b-ufc",q:"Irrigação dos núcleos da base e da cápsula interna",a:`
<h4>Núcleos da Base</h4>
<table>
  <tr><th>Estrutura</th><th>Principal irrigação</th></tr>
  <tr><td>Caudado + Putame (estriado)</td><td>Ramos lenticuloestriados da <strong>A. Cerebral Média</strong></td></tr>
  <tr><td>Globo pálido</td><td><strong>A. coroideia anterior</strong> (ramo da ACI)</td></tr>
  <tr><td>Cabeça do caudado (parte)</td><td>A. cerebral anterior + A. recorrente de Heubner</td></tr>
</table>
<h4>Cápsula Interna</h4>
<table>
  <tr><th>Parte</th><th>Irrigação</th></tr>
  <tr><td>Braço anterior</td><td>Lenticuloestriadas da ACM + A. recorrente de Heubner (ACA)</td></tr>
  <tr><td>Joelho</td><td>Lenticuloestriadas da ACM</td></tr>
  <tr><td>Braço posterior</td><td><strong>A. coroideia anterior</strong> + lenticuloestriadas</td></tr>
</table>
<div class="alert">⚠️ A. coroideia anterior é ramo direto da artéria carótida interna (ACI). Sua oclusão causa: hemiplegia + hemianestesia + hemianopsia homônima.</div>`},

{cat:0,src:"UFC 2015",b:"b-ufc",q:"Componentes do sistema límbico",a:`
<h4>Estruturas Principais</h4>
<ul>
  <li><strong>Hipocampo</strong>: memória declarativa</li>
  <li><strong>Amígdala</strong>: emoções, medo, respostas afetivas</li>
  <li><strong>Giro do cíngulo</strong>: atenção, dor emocional</li>
  <li><strong>Giro parahipocampal + córtex entorrinal</strong>: porta de entrada do hipocampo</li>
  <li><strong>Corpos mamilares</strong>: memória (lesão = síndrome de Korsakoff)</li>
  <li><strong>Núcleo anterior do tálamo</strong>: integrante do circuito de Papez</li>
  <li><strong>Área septal</strong>: prazer, modulação hipocampal</li>
  <li><strong>Fórnice</strong>: trato eferente principal</li>
  <li><strong>Núcleo accumbens</strong>: recompensa e motivação</li>
</ul>
<h4>Circuito de Papez (mais cobrado)</h4>
Hipocampo → Fórnice → Corpos Mamilares → Núcleo Anterior do Tálamo → Giro do Cíngulo → Córtex Entorrinal → Hipocampo`},

{cat:0,src:"UNICH 23.1",b:"b-unc",q:"Núcleo rubro — localização e função",a:`
<h4>Localização</h4>
<ul>
  <li>Tegmento mesencefálico, ao nível do <strong>colículo superior</strong></li>
  <li>Medialmente à substância negra</li>
  <li>Coloração rosada pelo depósito de ferro (daí o nome "rubro")</li>
</ul>
<h4>Função</h4>
<ul>
  <li>Coordenação motora, especialmente de <strong>membros superiores distais</strong></li>
  <li>Recebe aferências do <strong>cerebelo</strong> (via pedúnculo cerebelar superior — trato dentatorrúbrico) e do córtex motor</li>
  <li>Emite o <strong>trato rubroespinal</strong> (cruza na decussação tegmentar ventral de Forel)</li>
  <li>Regula tônus muscular e movimentos voluntários finos</li>
</ul>`},

{cat:0,src:"UNICH 23.1",b:"b-unc",q:"Comissura do fórnice — para onde se dirige e função",a:`
<h4>Anatomia</h4>
O fórnice é a principal via eferente do hipocampo. A <strong>comissura do fórnice</strong> (comissura hipocampal) é a porção transversal que une os dois pilares (cruras) do fórnice, conectando os hipocampos dos dois hemisférios.
<h4>Trajeto do Fórnice</h4>
Hipocampo → Cruras (pilares posteriores) → Corpo do fórnice → Colunas (pilares anteriores) → Corpos mamilares do hipotálamo
<h4>Função</h4>
<ul>
  <li>Transmissão de informações hipocampais aos <strong>corpos mamilares</strong> (hipotálamo)</li>
  <li>Integra o <strong>circuito de Papez</strong></li>
  <li>Essencial para memória episódica e orientação espacial</li>
  <li>A comissura em si conecta hipocampos bilateralmente</li>
</ul>`},

{cat:0,src:"UNICH 23.1",b:"b-unc",q:"Artéria cerebral média — territórios e lesão",a:`
<h4>Origem e Trajeto</h4>
Ramo terminal da <strong>artéria carótida interna</strong>. Percorre o sulco lateral (fissura de Sylvius).
<h4>Territórios</h4>
<ul>
  <li>Córtex frontal lateral, parietal lateral, temporal lateral</li>
  <li>Ínsula</li>
  <li>Área de Broca (giro frontal inferior — hemisf. dominante)</li>
  <li>Área de Wernicke (giro temporal superior — hemisf. dominante)</li>
  <li>Ramos perfurantes (lenticuloestriados) → núcleos da base, cápsula interna</li>
</ul>
<h4>Síndrome da ACM</h4>
<table>
  <tr><th>Déficit</th><th>Explicação</th></tr>
  <tr><td>Hemiplegia contralateral</td><td>Predomínio em face e MS (homúnculo)</td></tr>
  <tr><td>Hemianestesia contralateral</td><td>Córtex parietal</td></tr>
  <tr><td>Hemianopsia homônima</td><td>Radiações ópticas</td></tr>
  <tr><td>Afasia de Broca</td><td>Lesão do giro frontal inferior esq.</td></tr>
  <tr><td>Afasia de Wernicke</td><td>Lesão do giro temporal superior esq.</td></tr>
  <tr><td>Negligência contralateral</td><td>Hemisf. não dominante</td></tr>
</table>`},

{cat:0,src:"UNICH 23.2",b:"b-unc",q:"Hipocampo — estrutura e função",a:`
<h4>Localização</h4>
Face medial do lobo temporal, no assoalho do <strong>corno inferior do ventrículo lateral</strong>.
<h4>Estrutura</h4>
<ul>
  <li>Formação hipocampal = Hipocampo (CA1–CA4) + Giro dentado + Subículo</li>
  <li>Arquitetura trilaminar (arquicórtex — mais primitivo)</li>
  <li>CA1 é a região mais vulnerável à isquemia (<strong>zona de Sommer</strong>)</li>
</ul>
<h4>Função</h4>
<ul>
  <li>Formação de <strong>memória declarativa</strong> (explícita): episódica e semântica</li>
  <li>Consolidação de memórias de curto para longo prazo</li>
  <li>Navegação espacial (células de lugar)</li>
</ul>
<h4>Lesão Bilateral</h4>
<strong>Amnésia anterógrada grave</strong> — incapacidade de formar novas memórias (ex: caso H.M., encefalite herpética, Alzheimer).`},

{cat:0,src:"UNICH 23.2",b:"b-unc",q:"Composição do sistema nervoso periférico",a:`
<h4>Componentes</h4>
<ul>
  <li><strong>Nervos espinhais</strong>: 31 pares (8C, 12T, 5L, 5S, 1Co) — cada um com raiz dorsal (sensitiva) e ventral (motora)</li>
  <li><strong>Nervos cranianos</strong>: 12 pares (NC I a XII)</li>
  <li><strong>Gânglios sensitivos</strong>: gânglio da raiz dorsal (espinhal) e gânglios cranianos (trigeminal, geniculado, etc.)</li>
  <li><strong>Gânglios autonômicos</strong>: simpáticos paravertebrais (tronco simpático) e pré-vertebrais (celíaco, mesentérico); parassimpáticos terminais/intramurais</li>
  <li><strong>Plexos nervosos</strong>: cervical, braquial, lombossacral</li>
  <li><strong>Terminações nervosas</strong>: sensitivas e motoras (junções neuromusculares)</li>
</ul>
<h4>Componentes Funcionais</h4>
ASG (aferente somático geral) · ASE · ESG (eferente somático geral) · AVG · AVE · EVG · EVE`},

{cat:0,src:"UNICH 24.1",b:"b-unc",q:"Pilar do fórnice — função",a:`
<h4>Anatomia</h4>
Os <strong>pilares (colunas) do fórnice</strong> são as porções anteriores que emergem do corpo do fórnice, mergulham anteriores ao <strong>forame interventricular de Monro</strong> e atingem os <strong>corpos mamilares</strong> do hipotálamo.
<h4>Função</h4>
<ul>
  <li>Transmitir sinais do hipocampo aos corpos mamilares</li>
  <li>Conectar estruturas do <strong>circuito de Papez</strong></li>
  <li>Essencial para a memória episódica e orientação espacial</li>
  <li>Os pilares delimitam o forame interventricular lateralmente</li>
</ul>`},

{cat:0,src:"UNICH 24.1",b:"b-unc",q:"Artéria recorrente de Heubner — trajeto e função",a:`
<h4>Origem</h4>
Ramo da <strong>artéria cerebral anterior (ACA)</strong>, próximo à artéria comunicante anterior (ACoA). Pode originar da própria ACoA.
<h4>Trajeto</h4>
Segue lateralmente, <strong>recorrendo</strong> (voltando) em direção ao espaço perfurado anterior (daí o nome "recorrente").
<h4>Territórios Irrigados</h4>
<ul>
  <li>Cabeça do núcleo caudado</li>
  <li>Putame anteroinferior</li>
  <li><strong>Braço anterior da cápsula interna</strong></li>
  <li>Parte da área septal</li>
</ul>
<h4>Lesão</h4>
Hemiplegia contralateral, disartria, alterações comportamentais/de personalidade.`},

{cat:0,src:"UNICH 24.1",b:"b-unc",q:"Seio sagital superior — função",a:`
<h4>Localização</h4>
Ao longo da margem superior da <strong>foice do cérebro</strong>, da crista galli até a protuberância occipital interna (tórcula de Herófilo), onde se une aos seios transversos.
<h4>Funções</h4>
<ul>
  <li><strong>Drenagem venosa</strong> dos hemisférios cerebrais (veias corticais superficiais)</li>
  <li><strong>Reabsorção do LCR</strong> pelas granulações aracnoídeas (Pacchioni) que fazem protrusão em suas paredes laterais</li>
  <li>Drena para os seios transversos → seios sigmoides → veias jugulares internas</li>
</ul>
<div class="alert">⚠️ Trombose do seio sagital superior: hipertensão intracraniana, papiledema, convulsões.</div>`},

{cat:0,src:"UNICH 25.1",b:"b-unc",q:"Cápsula extrema — localização e função",a:`
<h4>Localização</h4>
Fina lâmina de substância branca situada <strong>lateralmente ao claustro</strong>. Sequência lateral→medial:
<br>Córtex insular → <strong>Cápsula extrema</strong> → Claustro → Cápsula externa → Putame → Cápsula interna
<h4>Função</h4>
<ul>
  <li>Conecta o <strong>córtex insular</strong> a outras áreas corticais</li>
  <li>Possivelmente envolvida em linguagem e processamento cognitivo</li>
  <li>Função ainda não completamente estabelecida na literatura</li>
</ul>`},

{cat:0,src:"UNICH 25.1",b:"b-unc",q:"Parede posterior da cavidade do diencéfalo",a:`
<h4>Cavidade do Diencéfalo</h4>
A cavidade do diencéfalo é o <strong>terceiro ventrículo</strong>.
<h4>Parede Posterior</h4>
Formada pelo <strong>epitálamo</strong>, que inclui:
<ul>
  <li><strong>Comissura posterior (epitálamo)</strong>: localizada acima da abertura do aqueduto cerebral (Sylvius)</li>
  <li><strong>Glândula pineal (epífise)</strong>: ligada à comissura posterior, secreta melatonina, regula ritmo circadiano</li>
  <li><strong>Trígono da habenula</strong>: contém os núcleos habenulares, relacionados ao sistema límbico</li>
</ul>
A abertura do <strong>aqueduto mesencefálico</strong> está na parede posterior inferior, comunicando o 3º com o 4º ventrículo.`},

{cat:0,src:"UNICH 25.1",b:"b-unc",q:"Paralisia facial central x periférica — explicação anatômica",a:`
<h4>Paralisia Central (Neurônio Motor Superior)</h4>
Lesão no <strong>córtex motor ou nas fibras corticonucleares</strong>.
<ul>
  <li>Acomete apenas o <strong>andar inferior contralateral</strong> (boca, lábio)</li>
  <li>Poupa o andar superior (fronte, orbicular do olho) pois este tem <strong>inervação bilateral</strong></li>
  <li>Causas: AVC, tumor, TCE</li>
</ul>
<h4>Paralisia Periférica (Neurônio Motor Inferior)</h4>
Lesão no <strong>núcleo do NC VII (ponte) ou no próprio nervo facial</strong>.
<ul>
  <li>Acomete <strong>toda a hemiface ipsilateral</strong> (andar superior + inferior)</li>
  <li>Pode associar: lacrimejamento, hiperacusia, alteração do paladar (2/3 ant. da língua)</li>
  <li>Causas: Paralisia de Bell, herpes zóster (Ramsay Hunt), tumor de parótida</li>
</ul>
<h4>Regra para lembrar</h4>
<em>Central → Contralateral inferior | Periférica → Ipsilateral toda a face</em>`},

{cat:0,src:"UNICH 25.1",b:"b-unc",q:"Polar frontal e área olfativa primária",a:`
<h4>Polo Frontal</h4>
<ul>
  <li>Extremidade anterior do lobo frontal (área 10 de Brodmann)</li>
  <li>Envolvido em funções executivas de alta ordem: memória de trabalho, tomada de decisão, cognição social, prospective memory</li>
  <li>Uma das regiões de maior expansão evolutiva no H. sapiens</li>
</ul>
<h4>Área Olfativa Primária</h4>
<ul>
  <li>Localizada no <strong>córtex piriforme</strong>: uncus + giro parahipocampal anterior + córtex entorrinal</li>
  <li>Paleocórtex (3 camadas — mais primitivo)</li>
  <li>Recebe projeções diretas do <strong>bulbo olfatório</strong> via trato olfatório</li>
  <li><strong>Única modalidade sensorial</strong> que não faz sinapse no tálamo antes de chegar ao córtex</li>
  <li>Lesão (ex: herniação uncal): alucinações olfativas, crises uncinadas</li>
</ul>`},

// ── CABEÇA E PESCOÇO ─────────────────────────────────────────
{cat:1,src:"UNICH 26.1",b:"b-unc",q:"Artéria tireoidea superior — limites dos 2 maiores trígonos cervicais e seus subtrígonos",a:`
<h4>Artéria Tireoidea Superior</h4>
Primeiro ramo anterior da <strong>artéria carótida externa</strong>. Irriga polo superior da tireoide e emite a <strong>artéria laríngea superior</strong>.
<h4>Trígono Cervical Anterior</h4>
<ul>
  <li>Superior: margem inferior da mandíbula</li>
  <li>Posterior: borda anterior do ECM</li>
  <li>Medial: linha mediana do pescoço</li>
</ul>
Subtrígonos: <span class="pill">Submandibular</span> <span class="pill">Submentual</span> <span class="pill">Carótico</span> <span class="pill">Muscular</span>
<h4>Trígono Cervical Posterior (Lateral)</h4>
<ul>
  <li>Anterior: borda posterior do ECM</li>
  <li>Posterior: borda anterior do trapézio</li>
  <li>Inferior: terço médio da clavícula</li>
</ul>
Subtrígonos: <span class="pill">Occipital</span> <span class="pill">Omoclavicular (supraclavicular)</span>`},

{cat:1,src:"UNICH 26.1",b:"b-unc",q:"Artéria vertebral — todos os ossos da órbita e suas localizações",a:`
<h4>Artéria Vertebral</h4>
Primeiro ramo da <strong>artéria subclávia</strong>. Sobe pelos forames transversos de C6 a C1, penetra no crânio pelo forame magno, irriga o tronco cerebral, cerebelo e forma a artéria basilar.
<h4>7 Ossos da Órbita</h4>
<table>
  <tr><th>Parede</th><th>Osso(s)</th></tr>
  <tr><td>Teto</td><td>Frontal (maior parte) + Asa menor do esfenoide</td></tr>
  <tr><td>Assoalho</td><td>Maxila (maior parte) + Zigomático + Palatino</td></tr>
  <tr><td>Parede medial</td><td>Etmoide (lâmina orbitária = lâmina papiracea) + Lacrimal + Maxila + Esfenoide (corpo)</td></tr>
  <tr><td>Parede lateral</td><td>Zigomático + Asa maior do esfenoide</td></tr>
</table>
<div class="alert">Macete — 7 ossos: <strong>F</strong>rontal, <strong>E</strong>sfenoide, <strong>E</strong>tmoide, <strong>M</strong>axila, <strong>Z</strong>igomático, <strong>L</strong>acrimal, <strong>P</strong>alatino</div>`},

{cat:1,src:"UNICH 26.1",b:"b-unc",q:"Gânglio cervical superior — ramos terminais do trigêmeo e implicações anatômicas",a:`
<h4>Gânglio Cervical Superior</h4>
Maior gânglio do tronco simpático, ao nível de C1-C3. Envia ramos simpáticos pós-ganglionares via plexos perivasculares das carótidas para estruturas da cabeça: pupila (midríase), glândulas salivares e sudoríparas, músculo liso vascular.
<h4>Ramos Terminais do Trigêmeo (NC V)</h4>
<table>
  <tr><th>Ramo</th><th>Ramos terminais</th><th>Território sensitivo</th></tr>
  <tr><td><strong>V1 — Oftálmico</strong></td><td>Frontal (supraorbital, supratroclear), Lacrimal, Nasociliar</td><td>Fronte, córnea, nariz superior, pálpebra superior</td></tr>
  <tr><td><strong>V2 — Maxilar</strong></td><td>Infraorbital, Zigomático, Alveolares superiores, Palatinos</td><td>Bochecha, lábio superior, nariz inferior, palato, dentes superiores</td></tr>
  <tr><td><strong>V3 — Mandibular</strong></td><td>Auriculotemporal, Bucal, Lingual, Alveolar inferior → Mentual</td><td>Mandíbula, lábio inferior, língua anterior (tato), dentes inferiores; <em>único com motor (mastigadores)</em></td></tr>
</table>`},

{cat:1,src:"UNICH 26.1",b:"b-unc",q:"Ramo marginal da mandíbula do plexo parotídeo — toda inervação da laringe",a:`
<h4>Ramo Marginal da Mandíbula (NC VII)</h4>
Ramo do plexo parotídeo que percorre a margem inferior da mandíbula. Inerva: <strong>depressor do ângulo da boca</strong>, depressor do lábio inferior e mentual. Risco cirúrgico em dissecções submandibulares.
<h4>Inervação da Laringe</h4>
Toda via <strong>nervo vago (NC X)</strong>, por dois ramos:
<table>
  <tr><th>Nervo</th><th>Tipo</th><th>Território</th></tr>
  <tr><td>N. Laríngeo Superior — <strong>Ramo Interno</strong></td><td>Sensitivo</td><td>Mucosa acima das pregas vocais (epiglote, vestíbulo laríngeo)</td></tr>
  <tr><td>N. Laríngeo Superior — <strong>Ramo Externo</strong></td><td>Motor</td><td>M. cricotireóideo (único músculo intrínseco não pelo NLR)</td></tr>
  <tr><td><strong>N. Laríngeo Recorrente (NLR)</strong></td><td>Motor + Sensitivo</td><td>Todos os outros músculos intrínsecos; mucosa abaixo das pregas vocais</td></tr>
</table>
<div class="alert">⚠️ Lesão do NLR esquerdo: mais comum (trajeto mais longo — passa pelo arco aórtico). Causa rouquidão ipsilateral.</div>`},

{cat:1,src:"UNICH 26.1",b:"b-unc",q:"N. Acessório — limites da cavidade nasal",a:`
<h4>Nervo Acessório (NC XI)</h4>
Inerva os músculos <strong>ECM</strong> (esternocleidomastoideo) e <strong>trapézio</strong>. Origem dupla: raiz cranial (bulbo) + raiz espinhal (C1-C5). Sai pelo forame jugular.
<h4>Limites da Cavidade Nasal</h4>
<table>
  <tr><th>Parede</th><th>Estruturas</th></tr>
  <tr><td>Anterior</td><td>Abertura piriforme</td></tr>
  <tr><td>Posterior</td><td>Coanas (comunicam com a nasofaringe)</td></tr>
  <tr><td>Superior (teto)</td><td>Ossos nasais, lâmina cribriforme do etmoide, corpo do esfenoide</td></tr>
  <tr><td>Inferior (assoalho)</td><td>Processo palatino da maxila + lâmina horizontal do palatino</td></tr>
  <tr><td>Medial</td><td>Septo nasal: lâmina perp. do etmoide + vômer + cartilagem do septo</td></tr>
  <tr><td>Lateral</td><td>Maxila, lacrimal, etmoide (conchas sup/méd), concha nasal inferior, palatino, pterigoide</td></tr>
</table>`},

{cat:1,src:"UFC 24.2",b:"b-ufc",q:"Conteúdo do forame oval",a:`
<h4>Forame Oval — Conteúdo</h4>
<ul>
  <li><strong>Nervo mandibular (V3)</strong> — principal estrutura</li>
  <li><strong>Nervo petroso menor</strong> (ramo do NC IX — parassimpático para parótida)</li>
  <li><strong>Artéria meníngea acessória</strong> (ramo da artéria maxilar)</li>
  <li><strong>Veia emissária</strong> (seio cavernoso ↔ plexo pterigoideo)</li>
</ul>
<div class="alert">Macete: <strong>V3 + Petroso Menor + Meníngea Acessória + Veia emissária</strong></div>`},

{cat:1,src:"UFC 24.2",b:"b-ufc",q:"Ramos da artéria carótida externa",a:`
<h4>8 Ramos Clássicos</h4>
<table>
  <tr><th>Grupo</th><th>Ramo</th><th>Irriga</th></tr>
  <tr><td rowspan="3">Anteriores</td><td>A. tireoidea superior</td><td>Tireoide (polo sup.), laringe</td></tr>
  <tr><td>A. lingual</td><td>Língua, glândula sublingual</td></tr>
  <tr><td>A. facial</td><td>Face, glândula submandibular</td></tr>
  <tr><td rowspan="2">Posteriores</td><td>A. occipital</td><td>Couro cabeludo posterior</td></tr>
  <tr><td>A. auricular posterior</td><td>Pavilhão auricular, couro cabeludo retroauricular</td></tr>
  <tr><td>Medial</td><td>A. faríngea ascendente</td><td>Faringe, meninges, tímpano</td></tr>
  <tr><td rowspan="2">Terminais</td><td>A. maxilar</td><td>Mandíbula, dentes, dura-máter (meníngea média), palato</td></tr>
  <tr><td>A. temporal superficial</td><td>Couro cabeludo temporal, face lateral</td></tr>
</table>`},

{cat:1,src:"UFC 24.2",b:"b-ufc",q:"Limites da faringe",a:`
<h4>Limites Gerais</h4>
<table>
  <tr><th>Limite</th><th>Estrutura</th></tr>
  <tr><td>Superior</td><td>Base do crânio (corpo do esfenoide + occipital basiiar)</td></tr>
  <tr><td>Inferior</td><td>Borda inferior da cartilagem cricoide (C6) → continua como esôfago</td></tr>
  <tr><td>Anterior</td><td>Coanas (nasofaringe) / Istmo das fauces (orofaringe) / Abertura da laringe (laringofaringe)</td></tr>
  <tr><td>Posterior</td><td>Fáscia bucofaríngea sobre os músculos constritores, espaço retrofaríngeo</td></tr>
</table>
<h4>Divisões e Limites Internos</h4>
<ul>
  <li><strong>Nasofaringe</strong>: base do crânio → palato mole</li>
  <li><strong>Orofaringe</strong>: palato mole → borda sup. da epiglote</li>
  <li><strong>Laringofaringe (hipofaringe)</strong>: borda sup. da epiglote → C6</li>
</ul>`},

{cat:1,src:"UFC 24.2",b:"b-ufc",q:"Limites dos dois maiores trígonos do pescoço e subtrígonos",a:`
<h4>Trígono Cervical Anterior</h4>
<ul>
  <li>Superior: margem inferior da mandíbula</li>
  <li>Posterior: borda anterior do ECM</li>
  <li>Medial: linha mediana</li>
</ul>
<strong>Subtrígonos:</strong>
<table>
  <tr><th>Subtrígono</th><th>Limites</th></tr>
  <tr><td>Submentual</td><td>Ventres anteriores dos digástricos + corpo do hioide</td></tr>
  <tr><td>Submandibular</td><td>Margem inf. mandíbula + ventres ant. e post. do digástrico</td></tr>
  <tr><td>Carótico</td><td>Ventre sup. do omohioideo + ventre post. do digástrico + borda ant. do ECM</td></tr>
  <tr><td>Muscular</td><td>Ventre sup. omohioideo + borda ant. ECM + plano mediano</td></tr>
</table>
<h4>Trígono Cervical Posterior (Lateral)</h4>
<ul>
  <li>Anterior: borda posterior do ECM</li>
  <li>Posterior: borda anterior do trapézio</li>
  <li>Inferior: terço médio da clavícula</li>
</ul>
<strong>Subtrígonos:</strong>
<table>
  <tr><th>Subtrígono</th><th>Limites</th></tr>
  <tr><td>Occipital</td><td>Borda post. ECM + borda ant. trapézio + ventre inf. omohioideo</td></tr>
  <tr><td>Omoclavicular</td><td>Borda post. ECM + ventre inf. omohioideo + terço médio da clavícula</td></tr>
</table>`},

{cat:1,src:"UFC 2015",b:"b-ufc",q:"Músculos extrínsecos da língua — inervação motora e sensitiva",a:`
<h4>Músculos Extrínsecos</h4>
<table>
  <tr><th>Músculo</th><th>Ação</th></tr>
  <tr><td>Genioglosso</td><td>Protrui a língua (principal protrusor)</td></tr>
  <tr><td>Hioglosso</td><td>Deprime e retrai a língua</td></tr>
  <tr><td>Estiloglosso</td><td>Retrai e eleva a língua</td></tr>
  <tr><td>Palatoglosso</td><td>Eleva a raiz da língua, fecha o istmo das fauces</td></tr>
</table>
<h4>Inervação Motora</h4>
Todos pelo <strong>N. Hipoglosso (NC XII)</strong>, exceto o palatoglosso → <strong>NC X (Vago)</strong> via plexo faríngeo.
<h4>Inervação Sensitiva da Língua</h4>
<table>
  <tr><th>Região</th><th>Modalidade</th><th>Nervo</th></tr>
  <tr><td rowspan="2">2/3 anteriores</td><td>Tato/pressão</td><td>N. Lingual (V3)</td></tr>
  <tr><td>Paladar</td><td>Corda do tímpano (NC VII) via N. Lingual</td></tr>
  <tr><td rowspan="2">1/3 posterior</td><td>Geral + Paladar</td><td>N. Glossofaríngeo (NC IX)</td></tr>
  <tr><td>Epiglote/raiz</td><td>N. Vago (NC X)</td></tr>
</table>`},

{cat:1,src:"UFC 2015",b:"b-ufc",q:"Ramos do plexo parotídeo",a:`
<h4>Formação</h4>
O NC VII sai pelo forame estilomastoideo e penetra na parótida, onde se divide em dois troncos: <strong>temporofacial</strong> (superior) e <strong>cervicofacial</strong> (inferior), formando o plexo parotídeo.
<h4>5 Ramos Terminais</h4>
<span class="pill">Temporal</span><span class="pill">Zigomático</span><span class="pill">Bucal</span><span class="pill">Marginal da mandíbula</span><span class="pill">Cervical</span>
<div class="alert">Macete: <strong>T</strong>o <strong>Z</strong>anzibar <strong>B</strong>y <strong>M</strong>otor <strong>C</strong>ar — Temporal, Zigomático, Bucal, Marginal, Cervical</div>
<h4>Funções</h4>
<ul>
  <li>Temporal: músculos da fronte (frontal)</li>
  <li>Zigomático: orbicular do olho (porção orbital)</li>
  <li>Bucal: zigomático maior, levantador do lábio, bucinador</li>
  <li>Marginal: depressores da boca e mentual</li>
  <li>Cervical: platisma</li>
</ul>`},

{cat:1,src:"UFC 2015",b:"b-ufc",q:"Os maiores trígonos do pescoço: limites e trígonos menores",a:`
<h4>Trígono Cervical Anterior</h4>
Limites: margem inf. mandíbula (sup.) · linha mediana (med.) · borda ant. ECM (post.)<br>
Subtrígonos: Submandibular · Submentual · Carótico · Muscular
<h4>Trígono Cervical Posterior</h4>
Limites: borda post. ECM (ant.) · borda ant. trapézio (post.) · terço médio da clavícula (inf.)<br>
Subtrígonos: Occipital · Omoclavicular`},

{cat:1,src:"UNICH 23.1",b:"b-unc",q:"Trígono omoclavicular — limites e conteúdo",a:`
<h4>Limites</h4>
<ul>
  <li>Anterior: borda posterior do ECM</li>
  <li>Superior: ventre inferior do músculo omohioideo</li>
  <li>Inferior: terço médio da clavícula</li>
</ul>
<h4>Conteúdo</h4>
<ul>
  <li><strong>Artéria subclávia</strong> (3ª parte)</li>
  <li><strong>Veia subclávia</strong></li>
  <li><strong>Troncos do plexo braquial</strong> (inferior e médio)</li>
  <li>Linfonodos supraclaviculares</li>
  <li><strong>Ducto torácico</strong> (lado esquerdo)</li>
  <li>Nervo frênico (na borda anterior do escaleno anterior)</li>
</ul>`},

{cat:1,src:"UNICH 23.1",b:"b-unc",q:"Cartilagem cricoide — função de delimitação anatômica",a:`
<h4>Características</h4>
Única cartilagem laríngea em forma de <strong>anel completo</strong>. Localizada ao nível de <strong>C6</strong>.
<h4>Funções de Delimitação</h4>
<ul>
  <li>Delimita a <strong>junção laringe-traqueia</strong> (abaixo dela começa a traqueia)</li>
  <li>Delimita a <strong>junção faringe-esôfago</strong> (posteriormente, na borda inferior da cricoide, a laringofaringe continua como esôfago)</li>
  <li>Marco anatômico para <strong>cricotireoidostomia de emergência</strong> (membrana cricotireoidea, entre a cricoide e a tireoide)</li>
  <li>Referência para início das estruturas cervicais inferiores (C6)</li>
</ul>`},

{cat:1,src:"UNICH 23.1",b:"b-unc",q:"Forame oval — conteúdo",a:`
<h4>Conteúdo do Forame Oval</h4>
<ul>
  <li><strong>Nervo mandibular (V3)</strong> — principal</li>
  <li><strong>Nervo petroso menor</strong> (NC IX — para gânglio ótico → parótida)</li>
  <li><strong>Artéria meníngea acessória</strong> (ramo da maxilar)</li>
  <li><strong>Veia emissária</strong> do seio cavernoso</li>
</ul>`},

{cat:1,src:"UNICH 23.1",b:"b-unc",q:"Nervo oculomotor — função",a:`
<h4>NC III — Oculomotor</h4>
<strong>Motor somático:</strong>
<ul>
  <li>M. elevador da pálpebra superior</li>
  <li>M. reto superior (eleva o olho)</li>
  <li>M. reto medial (aduz)</li>
  <li>M. reto inferior (deprime)</li>
  <li>M. oblíquo inferior (eleva em adução)</li>
</ul>
<strong>Motor visceral (parassimpático):</strong>
<ul>
  <li>Fibras pré-ganglionares → <strong>gânglio ciliar</strong> → M. esfíncter da pupila (miose) + M. ciliar (acomodação)</li>
</ul>
<h4>Lesão do NC III</h4>
<ul>
  <li>Ptose (pálpebra caída)</li>
  <li>Midríase (pupila dilatada — fibras parassimpáticas periféricas)</li>
  <li>Olho "para baixo e para fora" (ação do IV e VI sem oposição)</li>
  <li>Diplopia</li>
</ul>`},

{cat:1,src:"UNICH 23.1",b:"b-unc",q:"Prega vocal falsa — função",a:`
<h4>Localização</h4>
Acima das pregas vocais verdadeiras, separadas pelo ventrículo laríngeo. Também chamada de <strong>prega vestibular</strong>.
<h4>Funções</h4>
<ul>
  <li><strong>Proteção das vias aéreas</strong>: fechamento durante a deglutição (válvula de segurança)</li>
  <li><strong>Aumento de pressão intratorácica</strong>: manobra de Valsalva, tosse, espirro, defecação, parto</li>
  <li><strong>Não participa da fonação normal</strong> — fonação compensatória em paralisia das pregas verdadeiras</li>
</ul>
<table>
  <tr><th></th><th>Prega Verdadeira</th><th>Prega Falsa</th></tr>
  <tr><td>Função</td><td>Fonação</td><td>Proteção/válvula</td></tr>
  <tr><td>Mucosa</td><td>Epitélio escamoso</td><td>Epitélio respiratório</td></tr>
  <tr><td>Coloração</td><td>Branco-nacarada</td><td>Rosada</td></tr>
</table>`},

{cat:1,src:"UNICH 23.2",b:"b-unc",q:"Nervo hipoglosso — trajeto e função",a:`
<h4>Origem</h4>
Sulco anterolateral do bulbo (entre oliva e pirâmide), por vários filamentos que se unem.
<h4>Trajeto</h4>
Canal do hipoglosso (osso occipital) → lateral às aa. carótidas → cruza o NC X → arco hipoglosso → entra na língua
<h4>Função</h4>
Inervação <strong>motora</strong> de todos os músculos intrínsecos e extrínsecos da língua, exceto o palatoglosso (NC X).
<h4>Lesão</h4>
<ul>
  <li>Desvio da língua para o <strong>lado ipsilateral</strong> à lesão (ao protrui)</li>
  <li>Atrofia e fasciculações (lesão do NMI)</li>
  <li>Disartria, disfagia</li>
</ul>`},

{cat:1,src:"UNICH 23.2",b:"b-unc",q:"Inervação da língua — sensibilidade especial e motricidade",a:`
<h4>Inervação Sensitiva</h4>
<table>
  <tr><th>Região</th><th>Modalidade</th><th>Nervo</th></tr>
  <tr><td>2/3 ant.</td><td>Tato geral</td><td>N. Lingual (V3)</td></tr>
  <tr><td>2/3 ant.</td><td>Paladar (gustação)</td><td>Corda do tímpano (NC VII)</td></tr>
  <tr><td>1/3 post.</td><td>Geral + paladar</td><td>N. Glossofaríngeo (NC IX)</td></tr>
  <tr><td>Epiglote/raiz</td><td>Geral + paladar</td><td>N. Vago (NC X)</td></tr>
</table>
<h4>Inervação Motora</h4>
<strong>N. Hipoglosso (NC XII)</strong> → todos os músculos intrínsecos e extrínsecos, exceto palatoglosso (NC X).`},

{cat:1,src:"UNICH 24.1",b:"b-unc",q:"Músculo genioglosso — origem, inserção, ação e inervação",a:`
<h4>Genioglosso</h4>
<ul>
  <li><strong>Origem</strong>: espinha mental (apófise geni) da mandíbula</li>
  <li><strong>Inserção</strong>: face dorsal da língua em leque + corpo do hioide</li>
  <li><strong>Ação</strong>: protrui a língua (principal protrusor), deprime o centro, traciona o hioide anteriormente</li>
  <li><strong>Inervação</strong>: N. Hipoglosso (NC XII)</li>
</ul>
<div class="alert">É o maior músculo extrínseco da língua. Sua contração bilateral protruída de maneira simétrica. Paralisia bilateral → glossoptose (obstrução de VAS — ex: Pierre Robin).</div>`},

{cat:1,src:"UNICH 24.1",b:"b-unc",q:"Formação do plexo parotídeo",a:`
<h4>Trajeto do NC VII Intraparotídeo</h4>
<ol style="padding-left:18px">
  <li>NC VII emerge do forame estilomastoideo</li>
  <li>Dá ramos extra-parotídeos: auricular posterior, digástrico (ventre post.), estilo-hioideo</li>
  <li>Penetra na parótida e se divide em dois troncos:<br>
    • <strong>Temporofacial</strong> (superior)<br>
    • <strong>Cervicofacial</strong> (inferior)
  </li>
  <li>Esses troncos se interconectam formando o <strong>plexo parotídeo</strong></li>
  <li>Originam os 5 ramos terminais: <em>Temporal · Zigomático · Bucal · Marginal · Cervical</em></li>
</ol>`},

{cat:1,src:"UNICH 24.1",b:"b-unc",q:"Artéria vertebral — toda inervação sensitiva e motora da laringe",a:`
<h4>Artéria Vertebral</h4>
1º ramo da subclávia. Sobe pelos forames transversos C6→C1, entra no crânio pelo forame magno. Irriga tronco cerebral, cerebelo, medula cervical. Une-se à contralateral → A. basilar.
<h4>Inervação da Laringe — Via Vago (NC X)</h4>
<table>
  <tr><th>Nervo</th><th>Tipo</th><th>Estruturas</th></tr>
  <tr><td>N. Laríngeo Superior — <strong>ramo interno</strong></td><td>Sensitivo</td><td>Mucosa acima das pregas vocais</td></tr>
  <tr><td>N. Laríngeo Superior — <strong>ramo externo</strong></td><td>Motor</td><td>M. cricotireóideo (ÚNICO externo ao NLR)</td></tr>
  <tr><td><strong>N. Laríngeo Recorrente (NLR)</strong></td><td>Motor + Sensitivo</td><td>Todos os demais músculos intrínsecos + mucosa abaixo das pregas</td></tr>
</table>`},

{cat:1,src:"UNICH 25.1",b:"b-unc",q:"Ramo marginal da mandíbula — plexo cervical superficial",a:`
<h4>Ramo Marginal da Mandíbula (NC VII)</h4>
Percorre a margem inferior da mandíbula (por vezes abaixo dela). Inerva: depressor do ângulo da boca, depressor do lábio inferior, mentual. Lesão: desvio contralateral da boca.
<h4>Plexo Cervical Superficial</h4>
Emerge pelo <strong>ponto de Erb</strong> (borda posterior do ECM, meio do seu trajeto). Raízes C1-C4.
<table>
  <tr><th>Ramo</th><th>Raízes</th><th>Território</th></tr>
  <tr><td>N. occipital menor</td><td>C2</td><td>Couro cabeludo posterior e lateral</td></tr>
  <tr><td>N. auricular maior</td><td>C2, C3</td><td>Pavilhão auricular, parótida, região mastoidea</td></tr>
  <tr><td>N. transverso do pescoço</td><td>C2, C3</td><td>Pele anterior do pescoço</td></tr>
  <tr><td>Nn. supraclaviculares</td><td>C3, C4</td><td>Ombro, região clavicular, parte do tórax</td></tr>
</table>`},

{cat:1,src:"UNICH 25.1",b:"b-unc",q:"Nervo lingual — trajeto do nervo alveolar inferior",a:`
<h4>Nervo Lingual (ramo de V3)</h4>
Desce profundo ao pterigoideo lateral → recebe a <strong>corda do tímpano</strong> (NC VII, paladar + parassimpático) → cruza medialmente a mandíbula → assoalho da boca → lateral à língua.
Sensitivo: 2/3 anteriores (tato). Via corda do tímpano: paladar + secretomotor para glândulas submandibular e sublingual.
<h4>Nervo Alveolar Inferior (ramo de V3)</h4>
<ul>
  <li>Desce entre os pterigoideos, dá o <strong>nervo milohioideo</strong> (motor para milohioideo e ventre anterior do digástrico)</li>
  <li>Entra pelo <strong>forame mandibular</strong></li>
  <li>Percorre o <strong>canal mandibular</strong> dentro da mandíbula</li>
  <li>Inerva todos os dentes inferiores (plexo dental inferior)</li>
  <li>Sai pelo <strong>forame mentual</strong> como <strong>N. Mentual</strong> (sensitivo do mento e lábio inferior)</li>
</ul>`},

{cat:1,src:"UNICH 25.1",b:"b-unc",q:"Gânglio cervical superior — trígono perigoso da face",a:`
<h4>Gânglio Cervical Superior</h4>
Maior gânglio simpático, nível C1-C3. Pós-ganglionares viajam via plexo carotídeo para: dilatar a pupila, inervar glândulas da cabeça, músculo dilatador da pupila, músculo tarsal superior. Lesão → <strong>Síndrome de Horner</strong>: miose, ptose parcial, enoftalmia, anidrose ipsilateral.
<h4>Trígono Perigoso da Face</h4>
<ul>
  <li>Região delimitada pelos <strong>cantos da boca e a raiz do nariz</strong></li>
  <li>Perigosa porque as veias desta área (facial, angular) comunicam-se com o <strong>seio cavernoso</strong> via veia oftálmica (não tem válvulas)</li>
  <li>Infecções/espremidas de lesões → <strong>tromboflebite do seio cavernoso</strong> → sepse do seio cavernoso, oftalmoplegia, meningite</li>
</ul>`},

{cat:1,src:"UNICH 25.1",b:"b-unc",q:"Nervo lacrimal — composição",a:`
<h4>Nervo Lacrimal</h4>
Ramo de <strong>V1 (oftálmico)</strong>. Menor dos três ramos do oftálmico.
<h4>Composição</h4>
<ul>
  <li><strong>Sensitivo</strong> (V1): pele e conjuntiva da pálpebra lateral superior e canto lateral do olho</li>
  <li><strong>Secretomotor (parassimpático)</strong>: fibras pré-ganglionares do NC VII → gânglio pterigopalatino → nervo zigomático (ramo de V2) → <strong>ramo comunicante zigomático-lacrimal</strong> → nervo lacrimal → glândula lacrimal</li>
</ul>
<div class="alert">O nervo lacrimal carrega fibras sensitivas (V1) + fibras parassimpáticas secretomotoras (VII) "emprestadas" do zigomático.</div>`},

// ── TÓRAX E CORAÇÃO ───────────────────────────────────────────
{cat:2,src:"UNICH 26.1",b:"b-unc",q:"Trabécula septomarginal — função e conteúdo",a:`
<h4>Localização</h4>
Feixe muscular no interior do <strong>ventrículo direito</strong>, estendendo-se da base do septo interventricular até o músculo papilar anterior.
<h4>Função</h4>
<ul>
  <li>Transporta o <strong>ramo direito do feixe de His</strong> (sistema de condução) do septo até o músculo papilar anterior e a parede livre do VD</li>
  <li>Garante que a despolarização atinja eficientemente a base e a parede livre do VD</li>
  <li>Previne a superdistensão do VD (função estrutural secundária)</li>
</ul>
<h4>Conteúdo</h4>
<strong>Ramo direito do feixe de His</strong> (sistema de condução cardíaco).`},

{cat:2,src:"UNICH 26.1",b:"b-unc",q:"Brônquio segmentar lingular superior — explique o shunt pulmonar anatomicamente",a:`
<h4>Brônquio Segmentar Lingular Superior</h4>
Ramo do brônquio lobar superior esquerdo. Ventila o segmento lingular superior do lobo superior esquerdo (não há lobo médio no pulmão esquerdo — a língula é o equivalente).
<h4>Shunt Pulmonar — Anatomia</h4>
<strong>Shunt anatômico:</strong> sangue que retorna ao lado esquerdo do coração sem ter passado por alvéolos funcionantes.
<ul>
  <li><strong>Principal via</strong>: anastomose entre as veias brônquicas e as veias pulmonares via plexo venoso pulmonar superficial</li>
  <li>Veias brônquicas da região hilar drenam para ázigo/hemiázigo</li>
  <li>Anastomoses entre ramos terminais das artérias brônquicas com artérias pulmonares nas paredes dos bronquíolos e pleura visceral</li>
</ul>
<strong>Shunt fisiológico:</strong> inclui as veias de Thebésio (drenam diretamente no VE) e as veias pleurais.`},

{cat:2,src:"UNICH 26.1",b:"b-unc",q:"N. Intercostal — explique anatomicamente a prensa abdominal",a:`
<h4>Nervo Intercostal</h4>
Ramos ventrais dos nervos espinhais T1-T11. Percorrem os espaços intercostais no sulco costal (veia-artéria-nervo, de superior para inferior).
<h4>Prensa Abdominal</h4>
Mecanismo de aumento da pressão intra-abdominal pela contração simultânea de:
<ul>
  <li><strong>Diafragma</strong> (desce — NC Frênico)</li>
  <li><strong>Músculos abdominais</strong>: reto abdominal, oblíquo externo, oblíquo interno, transverso do abdome (inervados pelos nervos intercostais T7-T12 + iliohipogástrico + ilioinguinal)</li>
  <li><strong>Músculos do assoalho pélvico</strong> (elevador do ânus — fechamento inferior)</li>
</ul>
Usada em: defecação, micção, parto, vômito, tosse, espirro e levantamento de peso.`},

{cat:2,src:"UNICH 26.1",b:"b-unc",q:"N. Iliohipogástrico — explique os movimentos de alça de balde e braço de bomba",a:`
<h4>Nervo Iliohipogástrico</h4>
Raízes L1 (e T12). Ramo do plexo lombar. Sensitivo: pele da região inguinal e hipogástrica. Motor: músculo oblíquo interno e transverso inferior.
<h4>Movimento de Alça de Balde (Handle of Bucket)</h4>
Movimento das <strong>costelas médias</strong> (5ª-10ª) durante a respiração:
<ul>
  <li>As costelas giram em torno de seu eixo anteroposterior</li>
  <li>A margem lateral sobe e desce como a alça de um balde</li>
  <li>Aumenta o <strong>diâmetro lateral</strong> (transverso) do tórax</li>
</ul>
<h4>Movimento de Braço de Bomba (Pump Handle)</h4>
Movimento das <strong>costelas superiores</strong> (1ª-4ª) e do esterno:
<ul>
  <li>As costelas giram em torno de seu eixo lateral</li>
  <li>A parte anterior da costela e o esterno sobem e descem como um braço de bomba</li>
  <li>Aumenta o <strong>diâmetro ântero-posterior</strong> do tórax</li>
</ul>`},

{cat:2,src:"UFC 24.2",b:"b-ufc",q:"Ramos da artéria coronária direita",a:`
<h4>Artéria Coronária Direita (ACD)</h4>
Origem: seio aórtico direito. Trajeto: sulco atrioventricular direito.
<table>
  <tr><th>Ramo</th><th>Território</th></tr>
  <tr><td>A. do nó sinoatrial (SA)</td><td>Nó SA (~60% origina da ACD)</td></tr>
  <tr><td>Ramos atriais direitos</td><td>Parede do átrio direito</td></tr>
  <tr><td>A. do cone (infundibular)</td><td>Infundíbulo do ventrículo direito</td></tr>
  <tr><td>Ramos ventriculares direitos anteriores</td><td>Parede anterior do VD</td></tr>
  <tr><td><strong>A. marginal direita</strong> (ramo agudo)</td><td>Margem direita do coração, VD</td></tr>
  <tr><td>Ramos posteriores do VD</td><td>Parede posterior do VD</td></tr>
  <tr><td><strong>A. do nó AV</strong></td><td>Nó AV (~80% origina da ACD — dominância direita)</td></tr>
  <tr><td><strong>A. interventricular posterior (IVP)</strong></td><td>1/3 posterior do SIV, parede inferior do VE</td></tr>
  <tr><td>Ramos septais posteriores</td><td>Porção posterior do septo</td></tr>
</table>
<div class="alert">Dominância direita (~75%): ACD emite a IVP. Infarto de parede inferior (Q em DII, DIII, aVF) = oclusão da ACD.</div>`},

{cat:2,src:"UFC 24.2",b:"b-ufc",q:"Irrigação da parede torácica",a:`
<h4>Artérias da Parede Torácica</h4>
<table>
  <tr><th>Artéria</th><th>Origem</th><th>Território</th></tr>
  <tr><td><strong>A. torácica interna (mamária interna)</strong></td><td>Subclávia</td><td>Espaços intercostais anteriores (ramos intercostais anteriores), mamária, esterno</td></tr>
  <tr><td>A. musculofrênica</td><td>Ramo terminal da torácica interna</td><td>Intercostais inferiores anteriores + diafragma lateral</td></tr>
  <tr><td>A. epigástrica superior</td><td>Ramo terminal da torácica interna</td><td>Reto abdominal superior</td></tr>
  <tr><td><strong>Aa. intercostais posteriores</strong></td><td>Aorta torácica (3ª-11ª) / subclávia (1ª-2ª)</td><td>Espaços intercostais posteriores e laterais</td></tr>
  <tr><td>A. subcostal</td><td>Aorta torácica</td><td>Abaixo da 12ª costela</td></tr>
</table>`},

{cat:2,src:"UFC 24.2",b:"b-ufc",q:"Ramos da aorta torácica",a:`
<h4>Ramos Viscerais</h4>
<ul>
  <li><strong>Ramos brônquicos</strong> (2 esquerdos + 1 direito): irrigam brônquios e parênquima pulmonar</li>
  <li><strong>Ramos esofágicos</strong>: irrigam esôfago torácico</li>
  <li><strong>Ramos pericárdicos</strong></li>
  <li><strong>Ramos mediastinais</strong></li>
</ul>
<h4>Ramos Parietais</h4>
<ul>
  <li><strong>Aa. intercostais posteriores</strong>: 9 pares (3ª a 11ª costelas) — as 2 primeiras vêm do tronco costocervical da subclávia</li>
  <li><strong>A. subcostal</strong>: abaixo da 12ª costela</li>
  <li><strong>Aa. frênicas superiores</strong>: face superior do diafragma</li>
</ul>`},

{cat:2,src:"UFC 2015",b:"b-ufc",q:"Disposição das artérias e veias pulmonares",a:`
<h4>Artérias Pulmonares</h4>
Transportam sangue venoso (desoxigenado) do VD aos pulmões.
<ul>
  <li>Tronco pulmonar: origina do infundíbulo do VD, bifurca abaixo do arco aórtico</li>
  <li>A. pulmonar direita: mais longa, passa posterior à aorta ascendente e VCS</li>
  <li>A. pulmonar esquerda: mais curta, ligada ao ligamento arterioso (resquício do ducto arterioso)</li>
</ul>
<h4>Veias Pulmonares (4 veias)</h4>
<table>
  <tr><th>Veia</th><th>Drena</th></tr>
  <tr><td>Pulmonar superior direita</td><td>Lobos superior e médio direitos</td></tr>
  <tr><td>Pulmonar inferior direita</td><td>Lobo inferior direito</td></tr>
  <tr><td>Pulmonar superior esquerda</td><td>Lobo superior esquerdo</td></tr>
  <tr><td>Pulmonar inferior esquerda</td><td>Lobo inferior esquerdo</td></tr>
</table>
<h4>Disposição no Hilo Pulmonar</h4>
Hilo direito (de cima para baixo): <strong>A</strong>rtéria lobar superior → <strong>B</strong>rônquio → <strong>V</strong>eia<br>
Hilo esquerdo: <strong>A</strong>rtéria pulmonar (acima do brônquio) → <strong>B</strong>rônquio → <strong>V</strong>eia`},

{cat:2,src:"UFC 2015",b:"b-ufc",q:"Ramos da coronária direita",a:`
<h4>Ramos da ACD (em ordem proximal→distal)</h4>
<span class="pill">A. do nó SA (60%)</span><span class="pill">Ramos atriais direitos</span><span class="pill">A. do cone</span><span class="pill">Ramos ventriculares direitos ant.</span><span class="pill">A. marginal direita</span><span class="pill">A. do nó AV (80%)</span><span class="pill">A. interventricular posterior</span><span class="pill">Ramos septais posteriores</span>
<div class="alert">A IVP irriga o 1/3 posterior do septo e determina a dominância coronariana (direita ~75%).</div>`},

{cat:2,src:"UFC 2015",b:"b-ufc",q:"Órgãos e estruturas relacionadas à área cardíaca na radiografia",a:`
<h4>Radiografia em PA/PA</h4>
<table>
  <tr><th>Margem</th><th>Estruturas</th></tr>
  <tr><td>Direita</td><td>Veia cava superior (superior) + átrio direito (inferior)</td></tr>
  <tr><td>Esquerda</td><td>Arco aórtico + tronco pulmonar + aurícula esquerda + VE</td></tr>
  <tr><td>Inferior</td><td>Cúpulas diafragmáticas direita e esquerda</td></tr>
</table>
<h4>Radiografia Lateral</h4>
<ul>
  <li>Anterior: esterno e cartilagens costais</li>
  <li>Posterior: esôfago, traqueia, coluna vertebral</li>
  <li>Superior: carina, vasos da base</li>
  <li>Inferior: cúpulas diafragmáticas</li>
</ul>`},

{cat:2,src:"UFC 2015",b:"b-ufc",q:"Irrigação da parede torácica",a:`
<h4>Arterias</h4>
<ul>
  <li><strong>A. torácica interna (mamária)</strong>: ramo da subclávia → intercostais anteriores + ramos perfurantes</li>
  <li><strong>Aa. intercostais posteriores</strong> (3ª-11ª): ramos diretos da aorta torácica</li>
  <li><strong>Aa. intercostais posteriores superiores</strong> (1ª-2ª): do tronco costocervical (subclávia)</li>
  <li><strong>A. musculofrênica</strong>: terminal da torácica interna → intercostais 7ª-9ª ant.</li>
  <li><strong>A. subcostal</strong>: ramo da aorta torácica</li>
</ul>
<h4>Cada Espaço Intercostal</h4>
VAN = Veia · Artéria · Nervo (de superior para inferior, no sulco costal)`},

{cat:2,src:"UNICH 23.1",b:"b-unc",q:"Músculo papilar anterior — sistema de condução cardíaca que se liga a ele",a:`
<h4>Músculo Papilar Anterior</h4>
O maior músculo papilar do VD e do VE. Localizado na parede anterior de cada ventrículo.
<h4>Sistema de Condução — Ligação com o Papilar Anterior</h4>
A <strong>trabécula septomarginal</strong> (banda moderadora) transporta o <strong>ramo direito do feixe de His</strong> do septo interventricular até o músculo papilar anterior do VD.
<h4>Sequência do Sistema de Condução</h4>
Nó SA → Vias internodais (anterior/média/posterior) → Nó AV → Feixe de His → Ramo direito e esquerdo → Fibras de Purkinje → Músculo papilar → Miocárdio ventricular`},

{cat:2,src:"UNICH 23.2",b:"b-unc",q:"Ramos septais da artéria descendente anterior",a:`
<h4>Artéria Descendente Anterior (ADA / IVA)</h4>
Ramo da artéria coronária esquerda (ACE). Percorre o sulco interventricular anterior.
<h4>Ramos Septais</h4>
<ul>
  <li>Emergem perpendicularmente à ADA e penetram no septo interventricular</li>
  <li>Irrigam os <strong>2/3 anteriores do septo interventricular</strong></li>
  <li>Incluem a irrigação do <strong>feixe de His</strong> e dos <strong>ramos do feixe</strong></li>
  <li>Variam em número (geralmente 6-10 ramos septais)</li>
</ul>
<div class="alert">Oclusão proximal da ADA: infarto anterior extenso + bloqueio de ramo esquerdo (BRE) — pior prognóstico.</div>`},

{cat:2,src:"UNICH 23.2",b:"b-unc",q:"Inervação dos músculos cardíacos",a:`
<h4>Inervação Autonômica do Coração</h4>
<strong>Simpática:</strong>
<ul>
  <li>Pré-ganglionares: segmentos T1-T5 da medula</li>
  <li>Pós-ganglionares: gânglios cervicais (superior, médio, cervicotorácico) e torácicos superiores</li>
  <li>Efeitos: cronotropismo +, inotropismo +, dromotropismo +, batmotropismo +</li>
</ul>
<strong>Parassimpática (Vago — NC X):</strong>
<ul>
  <li>Pré-ganglionares: núcleo dorsal do vago e núcleo ambíguo</li>
  <li>Pós-ganglionares: gânglios intramurais no coração</li>
  <li>Efeitos: cronotropismo −, dromotropismo − (principalmente no nó SA e AV)</li>
</ul>
<h4>Dor Cardíaca (Angina)</h4>
Fibras aferentes viscerais acompanham as fibras simpáticas → T1-T5 → dor referida no precórdio, MS esquerdo, mandíbula.`},

{cat:2,src:"UNICH 24.1",b:"b-unc",q:"Crista terminal do átrio direito — dois tipos de shunt fisiológico",a:`
<h4>Crista Terminal</h4>
Crista muscular interna do átrio direito que separa a porção lisa posterior (derivada do seio venoso) da porção trabeculada anterior (aurícula). Externamente corresponde ao sulco terminal. O nó SA localiza-se próximo ao topo da crista terminal.
<h4>2 Tipos de Shunt Fisiológico</h4>
<strong>1. Shunt anatômico:</strong>
<ul>
  <li>Sangue que retorna ao coração esquerdo sem ter passado por capilares alveolares</li>
  <li>Anastomose veias brônquicas-veias pulmonares</li>
  <li>Veias de Thebésio (drenagem direta no VE)</li>
  <li>Representa ~2-3% do débito cardíaco</li>
</ul>
<strong>2. Shunt fisiológico:</strong>
<ul>
  <li>Regiões com V/Q = 0 (perfusão sem ventilação)</li>
  <li>Ex: consolidação pulmonar, atelectasia</li>
  <li>Inclui o shunt anatômico + áreas de baixa relação V/Q</li>
</ul>`},

{cat:2,src:"UNICH 24.1",b:"b-unc",q:"Artéria musculofrênica — toda a circulação da parede torácica",a:`
<h4>Artéria Musculofrênica</h4>
Ramo terminal lateral da <strong>artéria torácica interna</strong>. Corre ao longo da margem costal do diafragma. Irriga: intercostais anteriores (7ª-9ª costelas), diafragma lateral, músculos abdominais superiores.
<h4>Circulação Completa da Parede Torácica</h4>
<table>
  <tr><th>Artéria</th><th>Origem</th><th>Território</th></tr>
  <tr><td>Torácica interna</td><td>Subclávia</td><td>Intercostais ant. 1-6, esterno, mama</td></tr>
  <tr><td>Musculofrênica</td><td>Terminal da torácica interna</td><td>Intercostais ant. 7-9, diafragma lateral</td></tr>
  <tr><td>Epigástrica superior</td><td>Terminal da torácica interna</td><td>Reto abdominal superior</td></tr>
  <tr><td>Intercostais post. 1-2</td><td>Tronco costocervical (subclávia)</td><td>1º e 2º espaços post.</td></tr>
  <tr><td>Intercostais post. 3-11</td><td>Aorta torácica</td><td>3º ao 11º espaços post.</td></tr>
  <tr><td>A. subcostal</td><td>Aorta torácica</td><td>Abaixo da 12ª costela</td></tr>
</table>`},

{cat:2,src:"UNICH 24.1",b:"b-unc",q:"Ducto torácico e hilo pulmonar",a:`
<h4>Ducto Torácico</h4>
Principal coletor linfático do corpo. Origina-se da <strong>cisterna do quilo</strong> (L1-L2), sobe pelo mediastino posterior (à direita da aorta), cruza para a esquerda ao nível de T5, sobe pelo mediastino superior e drena na <strong>junção da veia jugular interna esquerda com a veia subclávia esquerda</strong> (ângulo venoso esquerdo).
<h4>Hilo Pulmonar — Disposição das Estruturas</h4>
<table>
  <tr><th></th><th>Direito</th><th>Esquerdo</th></tr>
  <tr><td>Superior</td><td>Brônquio lobar superior</td><td>Artéria pulmonar</td></tr>
  <tr><td>Anterior-inferior</td><td>Artéria pulmonar</td><td>Brônquio principal</td></tr>
  <tr><td>Inferior</td><td>Veias pulmonares (sup. e inf.)</td><td>Veias pulmonares (sup. e inf.)</td></tr>
</table>`},

{cat:2,src:"UNICH 25.1",b:"b-unc",q:"Hemiázigos acessória — composição do segmento pulmonar",a:`
<h4>Hemiázigos Acessória</h4>
Veia localizada à esquerda da coluna vertebral, drena as <strong>intercostais posteriores do lado esquerdo da 4ª à 8ª costelas</strong>. Cruza a coluna e drena na veia ázigos. (Hemiázigos drena as intercostais esquerdas inferiores — 9ª a 11ª.)
<h4>Composição do Segmento Pulmonar</h4>
<ul>
  <li>Unidade funcional e cirúrgica do pulmão</li>
  <li>Cada segmento possui:<br>
    • <strong>Brônquio segmentar</strong> (3ª subdivisão brônquica)<br>
    • <strong>Artéria segmentar</strong> (ramo da artéria pulmonar — caminha junto ao brônquio)<br>
    • <strong>Veia segmentar</strong> (drena na periferia, no septo intersegmentar)<br>
    • Parênquima pulmonar próprio
  </li>
  <li>Pulmão direito: 10 segmentos | Pulmão esquerdo: 8-10 segmentos</li>
</ul>`},

{cat:2,src:"UNICH 25.1",b:"b-unc",q:"Artéria epigástrica superior — ramos da aorta torácica",a:`
<h4>Artéria Epigástrica Superior</h4>
Ramo terminal medial da <strong>artéria torácica interna</strong>. Desce pelo músculo reto abdominal, anastomosa-se com a <strong>artéria epigástrica inferior</strong> (ramo da ilíaca externa) — importante via de circulação colateral na coarctação da aorta.
<h4>Ramos da Aorta Torácica</h4>
<strong>Viscerais:</strong> Ramos brônquicos · Ramos esofágicos · Ramos pericárdicos · Ramos mediastinais<br>
<strong>Parietais:</strong> Aa. intercostais posteriores (3ª-11ª) · A. subcostal · Aa. frênicas superiores`},

{cat:2,src:"UNICH 25.1",b:"b-unc",q:"Veia ázigos — vias hepatofugais da gástrica esquerda e das gástricas curtas",a:`
<h4>Veia Ázigos</h4>
Drena intercostais posteriores direitas (4ª-11ª) + hemiázigos + hemiázigos acessória. Drena na <strong>veia cava superior</strong> ao nível de T4-T5. Forma parte do sistema de circulação colateral entre VCI e VCS.
<h4>Vias Hepatofugais (Hipertensão Portal)</h4>
São as vias de circulação colateral que desviam o sangue portal do fígado:
<table>
  <tr><th>Via</th><th>Trajeto</th><th>Manifestação clínica</th></tr>
  <tr><td><strong>Gastroesofágica</strong></td><td>V. gástrica esquerda + gástricas curtas → plexo esofágico → veia ázigos → VCS</td><td>Varizes esofágicas (mais perigosa)</td></tr>
  <tr><td><strong>Umbilical/paraumbilical</strong></td><td>V. paraumbilical → v. epigástricas → superficiais da parede</td><td>Caput medusae</td></tr>
  <tr><td><strong>Retal</strong></td><td>V. retal superior (porta) → v. retais inf/média (VCI)</td><td>Hemorroidas</td></tr>
  <tr><td><strong>Retroperitoneal</strong></td><td>V. esplenorrenal espontânea</td><td>Varizes retroperitoneais</td></tr>
</table>`},

// ── ABDOME ────────────────────────────────────────────────────
{cat:3,src:"UNICH 26.1",b:"b-unc",q:"Lâmina anterior da bainha do reto — todas as camadas abdominais de externo para interno",a:`
<h4>Camadas da Parede Abdominal (externo → interno)</h4>
<ol style="padding-left:18px">
  <li>Pele</li>
  <li>Tela subcutânea (fáscia de Camper — gordurosa + fáscia de Scarpa — membranosa)</li>
  <li><strong>M. Oblíquo externo</strong> (aponeurose anterior da bainha do reto)</li>
  <li><strong>M. Oblíquo interno</strong> (aponeurose divide-se: lâmina ant. + post. da bainha do reto acima da linha arqueada)</li>
  <li><strong>M. Transverso do abdome</strong> (aponeurose → lâmina posterior acima da linha arqueada)</li>
  <li>Fáscia transversal</li>
  <li>Gordura pré-peritoneal (extraperitoneal)</li>
  <li>Peritônio parietal</li>
</ol>
<h4>Lâmina Anterior da Bainha do Reto</h4>
<strong>Acima da linha arqueada:</strong> aponeurose do oblíquo externo + lâmina ant. da aponeurose do oblíquo interno.<br>
<strong>Abaixo da linha arqueada:</strong> aponeurose de <strong>todos os 3 músculos</strong> passam anteriores ao reto.`},

{cat:3,src:"UNICH 26.1",b:"b-unc",q:"Recesso paraduodenal — espaço porta hepático anatomicamente",a:`
<h4>Recesso Paraduodenal</h4>
Prega e fossa peritoneal localizada à esquerda da porção ascendente do duodeno (4ª porção). Clinicamente importante pois pode ser sítio de hérnia interna paraduodenal esquerda.
<h4>Espaço (Hilo) Porta Hepático</h4>
O hilo hepático está contido no <strong>ligamento hepatoduodenal</strong>, que é a borda livre do omento menor.
<table>
  <tr><th>Estrutura</th><th>Posição</th></tr>
  <tr><td>Veia porta</td><td>Posterior</td></tr>
  <tr><td>A. hepática própria</td><td>Anterior esquerda</td></tr>
  <tr><td>Ducto colédoco</td><td>Anterior direita</td></tr>
</table>
O ligamento hepatoduodenal forma a borda anterior do <strong>forame omental (epiploico)</strong>.`},

{cat:3,src:"UFC 24.2",b:"b-ufc",q:"Formação do cordão inguinal (funículo espermático)",a:`
<h4>Funículo Espermático (Cordão Inguinal)</h4>
Formado no anel inguinal profundo e percorre o canal inguinal até o testículo.
<h4>Conteúdo</h4>
<ul>
  <li><strong>Ducto deferente</strong></li>
  <li><strong>A. testicular</strong> (ramo da aorta abdominal)</li>
  <li><strong>A. do ducto deferente</strong> (ramo da vesical inferior)</li>
  <li><strong>A. cremastérica</strong> (ramo da epigástrica inferior)</li>
  <li><strong>Plexo pampiniforme</strong> (veias testiculares)</li>
  <li>Plexo nervoso autônomo (simpático e parassimpático)</li>
  <li><strong>Ramo genital do N. genitofemoral</strong> (L1-L2 — motor para cremaster)</li>
  <li>Vasos linfáticos</li>
  <li>Resquício do processo vaginal</li>
</ul>
<h4>Envoltórios</h4>
Fáscia espermática interna + m. cremaster + fáscia espermática externa`},

{cat:3,src:"UFC 24.2",b:"b-ufc",q:"Definir circulação porta",a:`
<h4>Sistema Porta Hepático</h4>
Sistema venoso que drena o sangue dos órgãos digestivos abdominais e o conduz ao fígado antes de retornar à circulação sistêmica.
<h4>Formação da Veia Porta</h4>
V. mesentérica superior + V. esplênica (que já recebeu a V. mesentérica inferior) = <strong>veia porta</strong>, atrás do colo do pâncreas ao nível de L2.
<h4>Tributárias</h4>
<ul>
  <li>V. gástrica esquerda (coronária estomáquica)</li>
  <li>V. gástrica direita</li>
  <li>V. cística</li>
  <li>V. paraumbilical</li>
</ul>
<h4>Importância Clínica</h4>
Hipertensão portal → abertura de anastomoses portossistêmicas → varizes esofágicas, hemorroidas, caput medusae.`},

{cat:3,src:"UFC 24.2",b:"b-ufc",q:"Ramos da aorta abdominal",a:`
<h4>Ramos Viscerais Ímpares (ventrais)</h4>
<table>
  <tr><th>Ramo</th><th>Nível</th><th>Irriga</th></tr>
  <tr><td>Tronco celíaco</td><td>T12-L1</td><td>Estômago, fígado, baço, pâncreas, duodeno proximal</td></tr>
  <tr><td>A. mesentérica superior</td><td>L1</td><td>Intestino delgado, cólon até 2/3 do transverso</td></tr>
  <tr><td>A. mesentérica inferior</td><td>L3</td><td>1/3 distal transverso, descendente, sigmoide, reto superior</td></tr>
</table>
<h4>Ramos Viscerais Pares (laterais)</h4>
Suprarrenais médias · Renais · Gonadais (testiculares/ovarianas)
<h4>Ramos Parietais Pares</h4>
Frênicas inferiores · Lombares (4 pares)
<h4>Ramo Terminal Ímpar</h4>
A. sacral mediana — bifurca em ilíacas comuns (L4)`},

{cat:3,src:"UFC 2015",b:"b-ufc",q:"Limites e constituintes anatômicos do hilo hepático",a:`
<h4>Hilo Hepático</h4>
Localizado na face visceral do fígado, na fissura transversa (porta hepatis).
<h4>Limites</h4>
<ul>
  <li>Anterior: quadrado do fígado (lobo quadrado)</li>
  <li>Posterior: lobo caudado (lobo de Spiegel)</li>
  <li>Lateralmente: lobos direito e esquerdo</li>
</ul>
<h4>Conteúdo (Tríade Portal)</h4>
<table>
  <tr><th>Estrutura</th><th>Posição no ligamento hepatoduodenal</th></tr>
  <tr><td><strong>Veia porta</strong></td><td>Posterior</td></tr>
  <tr><td><strong>A. hepática própria</strong></td><td>Anterior esquerda</td></tr>
  <tr><td><strong>Ducto colédoco</strong></td><td>Anterior direita</td></tr>
</table>
Também entram/saem pelo hilo: vasos linfáticos e nervos do plexo hepático.`},

{cat:3,src:"UFC 2015",b:"b-ufc",q:"Ligamentos umbilicais e estruturas contidas neles",a:`
<h4>Pregas (Ligamentos) Umbilicais</h4>
<table>
  <tr><th>Prega</th><th>Posição</th><th>Conteúdo</th></tr>
  <tr><td><strong>Mediana</strong></td><td>Única, na linha mediana</td><td>Resquício do úraco (ligamento umbilical mediano)</td></tr>
  <tr><td><strong>Medial</strong> (par)</td><td>Lateral à mediana</td><td>Artéria umbilical obliterada (ligamento umbilical medial)</td></tr>
  <tr><td><strong>Lateral</strong> (par)</td><td>Mais lateral</td><td><strong>Artéria e veia epigástricas inferiores</strong> (únicas com vasos pérvios)</td></tr>
</table>`},

{cat:3,src:"UNICH 23.1",b:"b-unc",q:"Tríade portal — ordem de lateral para medial",a:`
<h4>Tríade Portal</h4>
Encontrada nos espaços porta do fígado (espaços de Kiernan).
<h4>Ordem Lateral → Medial</h4>
<strong>Ducto biliar</strong> (mais lateral) → <strong>Artéria hepática</strong> → <strong>Veia porta</strong> (mais medial/central)
<div class="alert">Macete: DAV — Ducto · Artéria · Veia (de lateral para medial). Ou: o ducto e a artéria são menores e ficam na periferia; a veia é a maior e fica ao centro.</div>`},

{cat:3,src:"UNICH 23.1",b:"b-unc",q:"Artéria epigástrica inferior — circulação colateral em caso de lesão",a:`
<h4>Artéria Epigástrica Inferior</h4>
Ramo da <strong>artéria ilíaca externa</strong>, origina logo acima do ligamento inguinal. Sobe medialmente para entrar na bainha do reto abdominal, anastomosa-se com a <strong>artéria epigástrica superior</strong> (ramo da torácica interna).
<h4>Circulação Colateral</h4>
Em caso de lesão ou coarctação da aorta, a anastomose epigástrica superior-inferior permite que o sangue da circulação sistêmica superior (subclávia → torácica interna → epigástrica superior) alcance a circulação da pelve e membros inferiores (epigástrica inferior → ilíaca externa).
<div class="alert">Na coarctação da aorta: dilatação das artérias intercostais e epigástricas visível na radiografia (entalhes costais).</div>`},

{cat:3,src:"UNICH 23.1",b:"b-unc",q:"Córtex renal — histologia",a:`
<h4>Córtex Renal</h4>
Região externa do rim, de coloração mais clara, contendo:
<ul>
  <li><strong>Corpúsculos renais (de Malpighi)</strong>: glomérulo + cápsula de Bowman</li>
  <li><strong>Túbulo contorcido proximal (TCP)</strong>: epitélio cúbico com microvilosidades (borda em escova)</li>
  <li><strong>Túbulo contorcido distal (TCD)</strong>: epitélio cúbico simples, sem borda em escova</li>
  <li><strong>Parte das alças de Henle</strong> (segmento espesso)</li>
  <li><strong>Túbulos coletores</strong> (porção cortical)</li>
</ul>
<h4>Colunas de Bertin</h4>
Extensões do córtex que penetram entre as pirâmides medulares.`},

{cat:3,src:"UNICH 23.2",b:"b-unc",q:"Veias hepáticas — drenagem e tributárias",a:`
<h4>Veias Hepáticas</h4>
Drenam o parênquima hepático e desembocam diretamente na <strong>veia cava inferior</strong>, no nível do diafragma.
<h4>3 Veias Hepáticas Principais</h4>
<table>
  <tr><th>Veia</th><th>Drena</th></tr>
  <tr><td><strong>Hepática direita</strong></td><td>Lobo direito (segmentos VI e VII principalmente)</td></tr>
  <tr><td><strong>Hepática média</strong></td><td>Segmentos IV (lobo esquerdo medial) e V-VIII (direito)</td></tr>
  <tr><td><strong>Hepática esquerda</strong></td><td>Lobo esquerdo (segmentos II e III) + lobo caudado (I)</td></tr>
</table>
<div class="alert">As veias hepáticas delimitam os segmentos de Couinaud (cirurgia hepática). Ausência de válvulas → sangue retrograda em hipertensão venosa.</div>`},

{cat:3,src:"UNICH 23.2",b:"b-unc",q:"De onde vêm os grupos das artérias suprarrenais",a:`
<h4>Artérias Suprarrenais — 3 Grupos</h4>
<table>
  <tr><th>Grupo</th><th>Origem</th></tr>
  <tr><td><strong>Suprarrenal superior</strong></td><td>Artéria frênica inferior (ramo da aorta abdominal)</td></tr>
  <tr><td><strong>Suprarrenal média</strong></td><td>Aorta abdominal diretamente</td></tr>
  <tr><td><strong>Suprarrenal inferior</strong></td><td>Artéria renal (ipsilateral)</td></tr>
</table>
<div class="alert">Macete: <strong>F</strong>rênica · <strong>A</strong>orta · <strong>R</strong>enal → Superior · Média · Inferior</div>`},

{cat:3,src:"UNICH 23.2",b:"b-unc",q:"Conteúdo das pregas mediana, medial e lateral do peritônio",a:`
<h4>As Três Pregas Umbilicais</h4>
<table>
  <tr><th>Prega</th><th>Posição</th><th>Conteúdo</th></tr>
  <tr><td><strong>Umbilical mediana</strong></td><td>Central única</td><td>Ligamento umbilical mediano (resquício do <strong>úraco</strong>)</td></tr>
  <tr><td><strong>Umbilical medial</strong></td><td>Par, lateral à mediana</td><td>Ligamento umbilical medial (artéria umbilical <strong>obliterada</strong>)</td></tr>
  <tr><td><strong>Umbilical lateral</strong></td><td>Par, mais lateral</td><td><strong>Vasos epigástricos inferiores</strong> (artéria + veia) — <em>pérvios</em></td></tr>
</table>`},

{cat:3,src:"UNICH 24.1",b:"b-unc",q:"Artéria renal direita — limites do trígono de Hesselbach",a:`
<h4>Artéria Renal Direita</h4>
Ramo lateral da aorta abdominal ao nível de L1-L2. A direita é mais longa, passa <strong>posterior</strong> à veia cava inferior, veia renal direita e cabeça do pâncreas.
<h4>Trígono (Triângulo) de Hesselbach</h4>
Define a área de fraqueza da parede posterior do canal inguinal, onde ocorrem as <strong>hérnias inguinais diretas</strong>.
<table>
  <tr><th>Limite</th><th>Estrutura</th></tr>
  <tr><td>Medial</td><td>Borda lateral do músculo reto abdominal</td></tr>
  <tr><td>Lateral</td><td>Artéria epigástrica inferior</td></tr>
  <tr><td>Inferior</td><td>Ligamento inguinal</td></tr>
</table>
<div class="alert">Hérnia direta: passa medialmente à epigástrica inferior (pelo trígono). Hérnia indireta: passa lateralmente (pelo anel inguinal profundo).</div>`},

{cat:3,src:"UNICH 24.1",b:"b-unc",q:"Ramificação direita da veia porta intra-hepática — circulação colateral na hipertensão portal",a:`
<h4>Ramificação Direita da Veia Porta</h4>
A veia porta se divide no hilo em <strong>ramo direito</strong> (curto, divide-se em anterior e posterior, irrigando segmentos V, VI, VII, VIII) e <strong>ramo esquerdo</strong> (mais longo, horizontalmente, irrigando segmentos I, II, III, IV).
<h4>Circulação Colateral — Hipertensão Portal</h4>
<table>
  <tr><th>Via</th><th>Anastomose</th><th>Clínica</th></tr>
  <tr><td>Gastroesofágica</td><td>Porta-ázigo-VCS</td><td>Varizes esofágicas</td></tr>
  <tr><td>Umbilical</td><td>Porta-epigástricas-VCS/VCI</td><td>Caput medusae</td></tr>
  <tr><td>Retal</td><td>Porta-VCI</td><td>Hemorroidas</td></tr>
  <tr><td>Retroperitoneal</td><td>Porta-VCI (esplenorrenal)</td><td>Varizes retroperitoneais</td></tr>
</table>`},

{cat:3,src:"UNICH 24.1",b:"b-unc",q:"Gástrica esquerda — limites do forame omental",a:`
<h4>Artéria Gástrica Esquerda</h4>
Ramo do tronco celíaco. Menor dos 3 ramos. Irriga pequena curvatura do estômago (anastomosa-se com a gástrica direita) e parte do esôfago inferior. Importante via hepatofugal na hipertensão portal.
<h4>Forame Omental (Epiploico / de Winslow)</h4>
Abertura que comunica a bolsa omental (retrocavidade dos epíploos) com a cavidade peritoneal maior.
<table>
  <tr><th>Limite</th><th>Estrutura</th></tr>
